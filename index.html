/* ---------------- SIDEBAR TOGGLE (mobile) ---------------- */

function openSidebar() { $('#sidebar').classList.add('open'); $('#sidebar-backdrop').classList.add('show'); }
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#sidebar-backdrop').classList.remove('show'); }
function toggleSidebar() { $('#sidebar').classList.contains('open') ? closeSidebar() : openSidebar(); }

/* ---------------- EVENT BINDING ---------------- */

function bindEvents() {
  // Sidebar
  $('#btn-new-chat').addEventListener('click', newChat);
  $('#menu-toggle').addEventListener('click', toggleSidebar);
  $('#sidebar-backdrop').addEventListener('click', closeSidebar);

  // Mode selector
  $$('#mode-selector .mode-btn').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  // Header
  $('#btn-settings').addEventListener('click', openSettings);
  $('#btn-help').addEventListener('click', openHelp);

  // Provider load buttons
  $$('[data-load]').forEach(btn => {
    btn.addEventListener('click', () => loadModels(btn.dataset.load));
  });

  // Provider key persistence on blur
  ['mistral', 'groq', 'google'].forEach(p => {
    const keyEl = $(`#api-key-${p}`);
    if (keyEl) {
      keyEl.addEventListener('change', () => {
        AppState.providers[p].apiKey = keyEl.value.trim();
        saveState();
      });
    }
    const modelEl = $(`#model-${p}`);
    if (modelEl) {
      modelEl.addEventListener('change', () => {
        AppState.providers[p].selectedModel = modelEl.value;
        // Groq reasoning visibility
        if (p === 'groq') {
          const rGroup = $('#reasoning-groq-group');
          const isReasoning = /deepseek-r1|qwen/i.test(modelEl.value);
          if (rGroup) rGroup.hidden = !isReasoning;
        }
        saveState();
      });
    }
  });

  const reasoningEl = $('#reasoning-groq');
  if (reasoningEl) {
    reasoningEl.addEventListener('change', () => {
      AppState.providers.groq.reasoning = reasoningEl.value;
      saveState();
    });
  }

  // Global system prompt
  const globalPrompt = $('#system-prompt');
  if (globalPrompt) {
    globalPrompt.addEventListener('change', () => {
      AppState.settings.globalSystemPrompt = globalPrompt.value;
      saveState();
    });
  }

  // Message input
  const msgInput = $('#msg-input');
  msgInput.addEventListener('input', autoResizeInput);
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Send button (toggle send/stop)
  $('#send-btn').addEventListener('click', () => {
    if (AppState.isLoading) stopGeneration();
    else sendMessage();
  });

  // Attach button
  $('#btn-attach').addEventListener('click', () => $('#file-input').click());
  $('#file-input').addEventListener('change', (e) => {
    handleFiles(e.target.files);
    e.target.value = '';
  });

  // Tool palette
  $('#btn-tools').addEventListener('click', () => toggleToolPalette());

  // Close tool palette when clicking outside
  document.addEventListener('click', (e) => {
    if (!AppState.toolPaletteOpen) return;
    const palette = $('#tool-palette');
    const btn = $('#btn-tools');
    if (palette && !palette.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
      toggleToolPalette(false);
    }
  });

  // Copy code buttons (delegated)
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-copy-code]');
    if (!btn) return;
    const block = btn.closest('.code-block');
    const code = block && block.querySelector('code');
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code.textContent || '');
      const originalText = btn.textContent;
      btn.textContent = '✓ Copiato';
      setTimeout(() => { btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copia'; }, 1500);
    } catch { toast('Copia non riuscita', 'error'); }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    // Ctrl/Cmd + N = new chat
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
      e.preventDefault();
      newChat();
    }
    // Escape closes modal/tool palette/sidebar
    if (e.key === 'Escape') {
      const modal = document.querySelector('.modal-overlay');
      if (modal) modal.remove();
      else if (AppState.toolPaletteOpen) toggleToolPalette(false);
      else closeSidebar();
    }
  });
}

/* ---------------- RESTORE UI STATE ---------------- */

function restoreUiState() {
  // Restore provider keys & selects
  ['mistral', 'groq', 'google'].forEach(p => {
    const keyEl = $(`#api-key-${p}`);
    if (keyEl && AppState.providers[p].apiKey) keyEl.value = AppState.providers[p].apiKey;
    const modelEl = $(`#model-${p}`);
    if (modelEl && AppState.providers[p].selectedModel) {
      modelEl.value = AppState.providers[p].selectedModel;
      if (p === 'groq') {
        const rGroup = $('#reasoning-groq-group');
        const isReasoning = /deepseek-r1|qwen/i.test(modelEl.value);
        if (rGroup) rGroup.hidden = !isReasoning;
      }
    }
    // Status dot based on models availability
    if (AppState.providers[p].models && AppState.providers[p].models.length > 0) {
      const dot = $(`#status-${p}`);
      const card = $(`#card-${p}`);
      if (dot) dot.classList.add('ok');
      if (card) card.classList.add('connected');
    }
  });

  const reasoningEl = $('#reasoning-groq');
  if (reasoningEl && AppState.providers.groq.reasoning) {
    reasoningEl.value = AppState.providers.groq.reasoning;
  }

  const globalPrompt = $('#system-prompt');
  if (globalPrompt) globalPrompt.value = AppState.settings.globalSystemPrompt || '';

  // Restore mode (fix bug: applica classe active correttamente)
  setMode(AppState.currentMode || 'erik', true);
}

/* ---------------- BOOTSTRAP ---------------- */

function init() {
  loadState();
  renderToolPalette();
  restoreUiState();

  // Assicurati che ci sia una chat attiva
  if (!AppState.currentChatId || !AppState.chats.has(AppState.currentChatId)) {
    if (AppState.chats.size === 0) {
      createNewChat();
    } else {
      // Riprendi l'ultima aggiornata
      const sorted = Array.from(AppState.chats.values())
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      AppState.currentChatId = sorted[0].id;
    }
  }

  renderChatList();
  renderMessages();
  bindEvents();

  // Focus input dopo breve delay per mobile
  setTimeout(() => {
    const input = $('#msg-input');
    if (input && window.innerWidth > 900) input.focus();
  }, 300);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
