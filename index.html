  const syncBtn = el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Sync' });
  syncBtn.addEventListener('click', () => {
    config.apiKey = apiKeyInput.value.trim();
    saveState();
    loadModels(providerName);
  });
  modelRow.appendChild(syncBtn);
  section.appendChild(modelRow);

  openModal((modal, overlay) => {

    modal.appendChild(compatSelect);

    const close = el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Close' });
    close.addEventListener('click', () => overlay.remove());
    
    const add = el('button', { class: 'btn btn-primary', type: 'button', text: 'Add Provider' });
    add.addEventListener('click', () => {
      const name = nameInput.value.trim();
      const url = urlInput.value.trim();
      const compat = compatSelect.value;

      if (!name || !url) {
        toast('Name and URL are required', 'error');
        return;
      }

      if (!url.startsWith('http')) {
        toast('URL must start with http:// or https://', 'error');
        return;
      }

      const id = `custom_${Date.now()}`;
      AppState.customProviders.set(id, {
        name,
        baseUrl: url,
        apiKey: '',
        models: [],
        selectedModel: '',
        compatible: compat
      });
      saveState();
      overlay.remove();
      openProviderSetup();
      toast('Custom provider added', 'success');
    });

    actions.appendChild(close);
    actions.appendChild(add);
    modal.appendChild(actions);
  });
}

function createProviderCard(key, config, isCustom) {
  const card = el('div', { 
    style: 'background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-3);'
  });

  const header = el('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:var(--sp-3);' });
  header.appendChild(el('div', { 
    style: 'font-weight:600;font-size:14px;', 
    text: config.name 
  }));
  
  if (config.apiKey && config.selectedModel) {
    header.appendChild(el('span', { class: 'tag-pill', text: 'Active' }));
  }
  
  if (isCustom) {
    header.appendChild(el('span', { 
      style: 'font-size:10px;padding:2px 6px;background:var(--warning-light);color:var(--warning);border-radius:var(--r-sm);font-weight:500;', 
      text: 'Custom' 
    }));
  }
  
  const spacer = el('div', { style: 'flex:1' });
  header.appendChild(spacer);
  
  if (isCustom) {
    const deleteBtn = el('button', { class: 'btn-icon danger', type: 'button', 'aria-label': 'Delete' },
      [el('span', { html: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>' })]);
    deleteBtn.addEventListener('click', () => {
      AppState.customProviders.delete(key);
      saveState();
      card.remove();
      toast('Provider removed', 'success');
    });
    header.appendChild(deleteBtn);
  }
  
  card.appendChild(header);

  // API Key
  card.appendChild(el('label', { class: 'input-label', text: 'API Key', style: 'margin-top:0' }));
  const keyInput = el('input', { 
    type: 'password', 
    class: 'input-field', 
    placeholder: 'Enter API key',
    value: config.apiKey || ''
  });
  keyInput.addEventListener('change', () => {
    config.apiKey = keyInput.value.trim();
    saveState();
  });
  card.appendChild(keyInput);

  // Model + Sync
  const modelRow = el('div', { style: 'display:flex;gap:8px;margin-top:var(--sp-3);' });
  const modelSelect = el('select', { class: 'select-field', style: 'flex:1' });
  
  if (config.models && config.models.length > 0) {
    config.models.forEach(m => {
      const opt = el('option', { value: m, text: m });
      if (m === config.selectedModel) opt.selected = true;
      modelSelect.appendChild(opt);
    });
  } else {
    modelSelect.appendChild(el('option', { value: '', text: 'Click Sync to load models' }));
  }
  
  modelSelect.addEventListener('change', () => {
    config.selectedModel = modelSelect.value;
    if (AppState.currentProvider === key) {
      AppState.currentModel = modelSelect.value;
      updateModelSelector();
    }
    saveState();
  });
  modelRow.appendChild(modelSelect);

  const syncBtn = el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Sync', style: 'white-space:nowrap' });
  syncBtn.addEventListener('click', () => {
    config.apiKey = keyInput.value.trim();
    saveState();
    loadModels(key).then(() => {
      // Refresh the select
      modelSelect.innerHTML = '';
      config.models.forEach(m => {
        const opt = el('option', { value: m, text: m });
        if (m === config.selectedModel) opt.selected = true;
        modelSelect.appendChild(opt);
      });
    });
  });
  modelRow.appendChild(syncBtn);
  card.appendChild(modelRow);

  return card;
}

function exportAllData() {
  const data = serializeSavedState();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: `naxa-export-${new Date().toISOString().slice(0,10)}.json` });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Data exported', 'success');
}

  openConfirmModal({
    title: 'Clear all chats?',
    message: 'This will delete all chats (saved and unsaved). This cannot be undone.',
    confirmText: 'Clear All',
    danger: true,

/* ---------------- EVENT BINDING ---------------- */

function bindEvents() {
  const on = (target, event, handler, options) => {
    if (!target) return;
    target.addEventListener(event, handler, options);
  };

  on($('#btn-new-mission'), 'click', newMission);
  on($('#menu-toggle'), 'click', toggleSidebar);
  on($('#btn-collapse-sidebar'), 'click', collapseSidebar);
  on($('#sidebar-backdrop'), 'click', closeSidebar);
  on($('#btn-settings'), 'click', openSettings);
  on($('#btn-stats'), 'click', openStatistics);
  on($('#user-menu'), 'click', openUserMenu);
  on($('#btn-share'), 'click', () => exportAllData());
  on($('#model-selector'), 'click', openProviderSetup);

  on($('#btn-voice'), 'click', toggleVoiceInput);

  const msgInput = $('#msg-input');
  on(msgInput, 'input', autoResizeInput);
  on(msgInput, 'keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && AppState.settings.sendOnEnter) {
      e.preventDefault();
      if (!AppState.isLoading) sendMessage();
    }
  });

  on($('#send-btn'), 'click', () => {
    if (AppState.isLoading) stopGeneration();
    else sendMessage();
  });

  on($('#btn-attach'), 'click', () => $('#file-input').click());
  on($('#file-input'), 'change', (e) => {
    handleFiles(e.target.files);
    e.target.value = '';
  });

  // Copy code (delegated)
  on(document, 'click', async (e) => {
    const btn = e.target.closest('[data-copy-code]');
    if (!btn) return;
    const block = btn.closest('.code-block');
    const code = block && block.querySelector('code');
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code.textContent || '');
      const original = btn.innerHTML;
      btn.textContent = '✓ Copied';
      setTimeout(() => { btn.innerHTML = original; }, 1500);
    } catch { toast('Copy failed', 'error'); }
  });

  // Keyboard shortcuts
  on(document, 'keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
      e.preventDefault();
      newMission();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      saveCurrentMission();
    }
    if (e.key === 'Escape') {
      const modal = document.querySelector('.modal-overlay');
      if (modal) modal.remove();
    }
  });
}

/* ---------------- RESTORE UI STATE ---------------- */

function restoreUiState() {
  // Restore API keys to inputs (not needed with new modal approach)
  setMode(AppState.currentMode || 'assistant', true);
  applyTheme();
  updateModelSelector();
  
  if (!AppState.sidebarOpen) {
    const sidebar = $('#sidebar');
    if (sidebar && window.innerWidth > 900) {
      sidebar.classList.add('collapsed');
    }
  }
}

/* ---------------- BOOTSTRAP ---------------- */

function init() {
  loadState();
  restoreUiState();

  // Ensure an active chat exists
  if (!AppState.currentChatId || !AppState.chats.has(AppState.currentChatId)) {
    if (AppState.chats.size === 0) {
      createNewMission();
    } else {
      const sorted = Array.from(AppState.chats.values())
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      AppState.currentChatId = sorted[0].id;
    }
  }

  renderChatLists();
  renderMessages();
  renderAttachmentBar();
  bindEvents();
  updateSendButton();

  // Auto-save drafts
  setInterval(() => {
    if (AppState.settings.autoSaveDrafts) {
      const chat = getCurrentChat();
      if (!chat.saved && chat.messages.length > 0) {
        saveState();
      }
    }
  }, AUTO_SAVE_INTERVAL_MS);

  // Focus input on desktop
  setTimeout(() => {
    const input = $('#msg-input');
    if (input && window.innerWidth > 900) input.focus();
  }, 300);

  // Warn before leaving with unsaved chats
  window.addEventListener('beforeunload', (e) => {
    const hasUnsavedWithMessages = Array.from(AppState.chats.values())
      .some(c => !c.saved && c.messages.length > 0);
    if (hasUnsavedWithMessages) {
      e.preventDefault();
      e.returnValue = 'You have unsaved chats.';
      return e.returnValue;
    }
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
