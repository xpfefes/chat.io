function renderMessage(msg, idx) {
  const isUser = msg.role === 'user';
  const isAssistant = msg.role === 'assistant';
  const chat = getCurrentChat();
  const isLastAssistant = isAssistant && idx === chat.messages.length - 1;

  const wrap = el('div', {
    class: `message role-${isUser ? 'user' : 'assistant'}`,
    'data-idx': String(idx)
  });

  const head = el('div', { class: 'message-head' });
  const avatar = el('div', {
    class: 'avatar ' + (isUser ? 'user' : 'assistant') + (AppState.isLoading && isLastAssistant ? ' streaming' : '')
  });
  avatar.appendChild(el('span', { text: isUser ? 'YOU' : 'AI' }));
  head.appendChild(avatar);

  const meta = el('div', { class: 'message-meta' });
  meta.appendChild(el('span', { class: 'message-role', text: isUser ? 'GROUND CONTROL' : 'MISSION CONTROL' }));
  if (msg.createdAt) {
    meta.appendChild(el('span', { class: 'message-timestamp', text: formatTime(msg.createdAt) }));
  }
  meta.appendChild(el('span', { class: 'message-id', text: `TX-${String(idx + 1).padStart(3, '0')}` }));
  head.appendChild(meta);

  wrap.appendChild(head);

  const body = el('div', { class: 'message-body' });

  if (msg.attachments && msg.attachments.length > 0) {
    const atts = el('div', { class: 'attachments' });
    msg.attachments.forEach(att => {
      const thumb = el('div', { class: 'attachment-thumb' });
      if (att.type && att.type.startsWith('image/') && att.data) {
        thumb.appendChild(el('img', { src: att.data, alt: escapeHtml(att.name || 'image') }));
      } else {
        thumb.appendChild(el('span', { text: att.name ? att.name.slice(0, 10) : 'file' }));
      }
      atts.appendChild(thumb);
    });
    body.appendChild(atts);
  }

  const content = el('div', { class: 'message-content' });
  if (isAssistant) {
    content.innerHTML = parseMarkdown(msg.content || '');
    if (AppState.isLoading && isLastAssistant) {
      content.appendChild(el('span', { class: 'streaming-caret' }));
    }
  } else {
    content.textContent = msg.content || '';
  }
  body.appendChild(content);

  if (isLastAssistant && !AppState.isLoading && msg.content) {
    const actions = el('div', { class: 'message-actions' });

    const likeBtn = el('button', { class: 'action-btn like' + (msg.like ? ' active' : ''), type: 'button' }, [
      el('span', { html: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>' }),
      el('span', { text: 'LIKE' })
    ]);
    likeBtn.addEventListener('click', () => toggleLike(idx));

    const disBtn = el('button', { class: 'action-btn dislike' + (msg.dislike ? ' active' : ''), type: 'button' }, [
      el('span', { html: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>' }),
      el('span', { text: 'DISLIKE' })
    ]);
    disBtn.addEventListener('click', () => toggleDislike(idx));

    const regenBtn = el('button', { class: 'action-btn', type: 'button' }, [
      el('span', { html: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>' }),
      el('span', { text: 'REGEN' })
    ]);
    regenBtn.addEventListener('click', () => regenerate(idx));

    const copyBtn = el('button', { class: 'action-btn', type: 'button' }, [
      el('span', { html: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' }),
      el('span', { text: 'COPY' })
    ]);
    copyBtn.addEventListener('click', () => copyMessage(idx));

    actions.appendChild(likeBtn);
    actions.appendChild(disBtn);
    actions.appendChild(regenBtn);
    actions.appendChild(copyBtn);
    body.appendChild(actions);

    if (AppState.settings.followUpEnabled && Array.isArray(msg.followUps) && msg.followUps.length > 0) {
      const fwrap = el('div', { class: 'follow-ups' });
      msg.followUps.slice(0, AppState.settings.followUpCount).forEach(q => {
        const chip = el('button', { class: 'follow-up-chip', type: 'button', text: q });
        chip.addEventListener('click', () => {
          const input = $('#msg-input');
          if (input) { input.value = q; autoResizeInput(); sendMessage(); }
        });
        fwrap.appendChild(chip);
      });
      body.appendChild(fwrap);
    }
  }

  wrap.appendChild(body);
  return wrap;
}

function formatTime(ts) {
  try {
    const d = new Date(ts);
    return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  } catch { return '--:--:--'; }
}

function scrollToBottom() {
  const c = $('#chat-container');
  if (c) c.scrollTop = c.scrollHeight;
}

function updateStreamingContent(content) {
  const chat = getCurrentChat();
  const lastIdx = chat.messages.length - 1;
  const msgNode = document.querySelector(`.message[data-idx="${lastIdx}"] .message-content`);
  if (!msgNode) return;
  msgNode.innerHTML = parseMarkdown(content || '');
  msgNode.appendChild(el('span', { class: 'streaming-caret' }));
  scrollToBottom();
}

/* ---------------- MODE SWITCHING ---------------- */

function setMode(mode, silent = false) {
  if (!SYSTEM_PROMPTS[mode]) return;
  AppState.currentMode = mode;
  $$('.mode-btn').forEach(btn => {
    const isActive = btn.dataset.mode === mode;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
  const chat = getCurrentChat();
  chat.mode = mode;
  chat.updatedAt = Date.now();
  if (chat.saved) saveState();
  if (!silent) toast(`Mode: ${modeLabel(mode)}`, 'success');
}

function modeLabel(m) {
  return { erik: 'Erik', assistant: 'Assistant', coder: 'Coder', support: 'Support' }[m] || m;
}

/* ---------------- SYSTEM PROMPT BUILDER ---------------- */

function buildSystemPrompt() {
  const chat = getCurrentChat();
  const parts = [];

  const modePrompt = SYSTEM_PROMPTS[chat.mode || AppState.currentMode];
  if (modePrompt) parts.push(modePrompt);

  if (AppState.settings.globalSystemPrompt && AppState.settings.globalSystemPrompt.trim()) {
    parts.push('--- GLOBAL INSTRUCTIONS ---');
    parts.push(AppState.settings.globalSystemPrompt.trim());
  }

  if (chat.likeFeedback) {
    parts.push(`--- POSITIVE FEEDBACK ---\n"${chat.likeFeedback}". Maintain this style.`);
  }
  if (chat.dislikeFeedback) {
    parts.push(`--- NEGATIVE FEEDBACK ---\n"${chat.dislikeFeedback}". Avoid this approach.`);
  }

  return parts.join('\n\n');
}

/* ---------------- API STREAMING (DR-3: AbortController + timeout) ---------------- */

function getCurrentProvider() {
  if (AppState.providers.mistral.selectedModel && AppState.providers.mistral.apiKey) return 'mistral';
  if (AppState.providers.groq.selectedModel && AppState.providers.groq.apiKey) return 'groq';
  if (AppState.providers.google.selectedModel && AppState.providers.google.apiKey) return 'google';
  return null;
}

async function loadModels(provider) {
  const apiKeyEl = $(`#api-key-${provider}`);
  if (!apiKeyEl) return;
  const apiKey = apiKeyEl.value.trim();
  if (!apiKey) { toast('API Key required', 'error'); return; }

  AppState.providers[provider].apiKey = apiKey;
  saveState();

  const select = $(`#model-${provider}`);
  if (!select) return;
  select.innerHTML = '<option value="">Syncing...</option>';

  const timeoutController = new AbortController();
  const timeoutId = setTimeout(() => timeoutController.abort(), FETCH_TIMEOUT_MS);

  try {
    let url, headers = {};
    const cfg = AppState.providers[provider];
    if (provider === 'mistral' || provider === 'groq') {
      url = `${cfg.baseUrl}/models`;
      headers = { 'Authorization': `Bearer ${apiKey}` };
    } else if (provider === 'google') {
      url = `${cfg.baseUrl}/models?key=${encodeURIComponent(apiKey)}`;
    }

    const res = await fetch(url, {
      method: 'GET',
      headers,
      signal: timeoutController.signal
    });

    clearTimeout(timeoutId);

    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const data = await res.json();

    let models = [];
    if (provider === 'google') {
      models = (data.models || [])
        .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent'))
        .map(m => (m.name || '').replace('models/', ''))
        .filter(Boolean);
    } else {
      models = (data.data || []).map(m => m.id).filter(Boolean);
    }

    cfg.models = models;
    select.innerHTML = '<option value="">Select model...</option>';
    models.forEach(m => select.appendChild(el('option', { value: m, text: m })));

    if (cfg.selectedModel && models.includes(cfg.selectedModel)) {
      select.value = cfg.selectedModel;
    }

    $(`#status-${provider}`).classList.add('online');
    $(`#card-${provider}`).classList.add('connected');
    updateUplinkStatus();
    toast(`${models.length} ${provider} models synced`, 'success');
    saveState();
  } catch (err) {
    clearTimeout(timeoutId);
    console.error('loadModels:', err);
    select.innerHTML = '<option value="">Sync failed</option>';
    $(`#status-${provider}`).classList.remove('online');
    $(`#card-${provider}`).classList.remove('connected');
    updateUplinkStatus();
    const msg = err.name === 'AbortError' ? 'Request timeout' : err.message;
    toast(`Sync error: ${msg}`, 'error');
  }
}

function updateUplinkStatus() {
  const statusLight = $('#uplink-status');
  if (!statusLight) return;
  const hasProvider = getCurrentProvider() !== null;
  statusLight.classList.toggle('online', hasProvider);
}

async function streamChat(provider, model, messages, { onChunk, onError, onComplete, signal }) {
  const cfg = AppState.providers[provider];
  if (!cfg || !cfg.apiKey || !model) {
    onError(new Error('Provider or model not configured'));
    return;
  }

  let url, headers = { 'Content-Type': 'application/json' }, body;

  if (provider === 'mistral' || provider === 'groq') {
    url = `${cfg.baseUrl}/chat/completions`;
    headers.Authorization = `Bearer ${cfg.apiKey}`;
    body = {
      model,
      messages,
      stream: true,
      temperature: AppState.settings.temperature,
      max_tokens: AppState.settings.maxTokens
    };
    if (provider === 'groq' && cfg.reasoning && cfg.reasoning !== 'none') {
      body.reasoning_effort = cfg.reasoning;
    }
  } else if (provider === 'google') {
    url = `${cfg.baseUrl}/models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(cfg.apiKey)}`;
    body = {
      contents: messages
        .filter(m => m.role !== 'system')
        .map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
      systemInstruction: messages.find(m => m.role === 'system')
        ? { parts: [{ text: messages.find(m => m.role === 'system').content }] }
        : undefined,
      generationConfig: {
        temperature: AppState.settings.temperature,
        maxOutputTokens: AppState.settings.maxTokens
      }
    };
  }

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal
    });

    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try {
        const errData = await res.json();
        msg = errData?.error?.message || errData?.error || msg;
      } catch { /* ignore */ }
      throw new Error(msg);
    }
    if (!res.body) throw new Error('Response body not available');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === '[DONE]') { onComplete(); return; }
        try {
          const obj = JSON.parse(payload);
          let delta = '';
          if (provider === 'mistral' || provider === 'groq') {
            delta = obj?.choices?.[0]?.delta?.content || '';
          } else if (provider === 'google') {
            delta = obj?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          }
          if (delta) onChunk(delta);
        } catch { /* ignore parse errors */ }
      }
    }
    onComplete();
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    onError(err);
  }
}

/* ---------------- SEND MESSAGE ---------------- */

async function sendMessage() {
  const input = $('#msg-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text || AppState.isLoading) return;

  const provider = getCurrentProvider();
  if (!provider) {
    toast('Uplink provider: insert API Key and select model', 'error');
    return;
  }

  const chat = getCurrentChat();
  const userMsg = {
    role: 'user',
    content: text,
    attachments: [...AppState.attachments],
    createdAt: Date.now()
  };
  chat.messages.push(userMsg);
  if (chat.messages.length === 1) {
    chat.title = 'Mission: ' + text.slice(0, 36) + (text.length > 36 ? '…' : '');
  }

  AppState.attachments = [];
  input.value = '';
  autoResizeInput();
  renderAttachmentBar();

  const assistantMsg = {
    role: 'assistant',
    content: '',
    like: false,
    dislike: false,
    likeFeedback: null,
    dislikeFeedback: null,
    followUps: [],
    createdAt: Date.now()
  };
  chat.messages.push(assistantMsg);
  chat.updatedAt = Date.now();
  if (chat.saved) saveState();

  renderMessages();
  renderChatLists();
  renderSaveIndicator();

  AppState.isLoading = true;
  AppState.abortController = new AbortController();
  updateSendButton();

  const systemPrompt = buildSystemPrompt();
  const apiMessages = [
    { role: 'system', content: systemPrompt },
    ...chat.messages
      .filter(m => (m.role === 'user' || m.role === 'assistant') && m.content)
      .map(m => ({ role: m.role, content: m.content }))
  ];

  const model = AppState.providers[provider].selectedModel;
  let fullContent = '';

  await streamChat(provider, model, apiMessages, {
    signal: AppState.abortController.signal,
    onChunk: (chunk) => {
      fullContent += chunk;
      assistantMsg.content = fullContent;
      updateStreamingContent(fullContent);
    },
    onError: (err) => {
      console.error('Stream error:', err);
      assistantMsg.content = `⚠️ Transmission failed: ${err.message}`;
      AppState.isLoading = false;
      AppState.abortController = null;
      updateSendButton();
      renderMessages();
      toast(`Error: ${err.message}`, 'error');
    },
    onComplete: () => {
      assistantMsg.content = fullContent;
      assistantMsg.followUps = extractFollowUps(fullContent);
      AppState.isLoading = false;
      AppState.abortController = null;
      updateSendButton();
      chat.updatedAt = Date.now();
      if (chat.saved) saveState();
      renderMessages();
      renderChatLists();
    }
  });
}

function extractFollowUps(text) {
  if (!AppState.settings.followUpEnabled) return [];
  if (typeof text !== 'string') return [];
  const out = [];
  const rx = /(?:\?|Vuoi|Posso|Dimmi|Spiegami)[^.?!]*\?/gi;
  const matches = text.match(rx) || [];
  for (const m of matches) {
    const q = m.trim();
    if (q.length > 10 && q.length < 120 && out.length < AppState.settings.followUpCount) {
      out.push(q);
    }
  }
  return out;
}

function stopGeneration() {
  if (AppState.abortController) {
    AppState.abortController.abort();
    AppState.abortController = null;
  }
  AppState.isLoading = false;
  updateSendButton();
  toast('Transmission aborted', 'info');
}

function updateSendButton() {
  const btn = $('#send-btn');
  if (!btn) return;
  if (AppState.isLoading) {
    btn.classList.add('stop');
    btn.setAttribute('aria-label', 'Abort transmission');
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12"/></svg>';
  } else {
    btn.classList.remove('stop');
    btn.setAttribute('aria-label', 'Transmit');
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
  }
}

/* ---------------- MESSAGE ACTIONS ---------------- */

function toggleLike(idx) {
  const chat = getCurrentChat();
  const msg = chat.messages[idx];
  if (!msg) return;
  if (msg.like) {
    msg.like = false;
    msg.likeFeedback = null;
    chat.likeFeedback = null;
  } else {
    msg.like = true;
    msg.dislike = false;
    msg.dislikeFeedback = null;
    openPromptModal({
      title: 'What did you like?',
      placeholder: 'Optional feedback (AI will use this style)',
      defaultValue: '',
      optional: true,
      onSubmit: (val) => {
        msg.likeFeedback = val || null;
        chat.likeFeedback = val || null;
        chat.updatedAt = Date.now();
        if (chat.saved) saveState();
        renderMessages();
        if (val) toast('Feedback saved', 'success');
      }
    });
    return;
  }
  chat.updatedAt = Date.now();
  if (chat.saved) saveState();
  renderMessages();
}

function toggleDislike(idx) {
  const chat = getCurrentChat();
  const msg = chat.messages[idx];
  if (!msg) return;
  if (msg.dislike) {
    msg.dislike = false;
    msg.dislikeFeedback = null;
    chat.dislikeFeedback = null;
    chat.updatedAt = Date.now();
    if (chat.saved) saveState();
    renderMessages();
    return;
  }
  openPromptModal({
    title: 'What needs improvement?',
    placeholder: 'Describe how AI should improve',
    defaultValue: '',
    onSubmit: (val) => {
      if (!val) return;
      msg.dislike = true;
      msg.like = false;
      msg.dislikeFeedback = val;
      chat.dislikeFeedback = val;
      chat.updatedAt = Date.now();
      if (chat.saved) saveState();
      renderMessages();
      toast('Negative feedback saved', 'success');
    }
  });
}

function regenerate(idx) {
  if (AppState.isLoading) return;
  const chat = getCurrentChat();
  let userIdx = -1;
  for (let i = idx - 1; i >= 0; i--) {
    if (chat.messages[i] && chat.messages[i].role === 'user') { userIdx = i; break; }
  }
  if (userIdx < 0) { toast('Cannot regenerate', 'warning'); return; }
  const userMsg = chat.messages[userIdx];
  chat.messages = chat.messages.slice(0, idx);
  chat.updatedAt = Date.now();
  if (chat.saved) saveState();
  renderMessages();
  const input = $('#msg-input');
  if (input) { input.value = userMsg.content; autoResizeInput(); }
  sendMessage();
}

async function copyMessage(idx) {
  const chat = getCurrentChat();
  const msg = chat.messages[idx];
  if (!msg || !msg.content) return;
  try {
    await navigator.clipboard.writeText(msg.content);
    toast('Copied to clipboard', 'success');
  } catch {
    toast('Copy failed', 'error');
  }
}

/* ---------------- FILE ATTACHMENTS (DR-6: proper cleanup) ---------------- */

function handleFiles(files) {
  if (!files || files.length === 0) return;
  for (const file of files) {
    if (file.size > 10 * 1024 * 1024) {
      toast(`${file.name}: too large (max 10MB)`, 'warning');
      continue;
    }
    const reader = new FileReader();
    reader.onload = () => {
      AppState.attachments.push({
        name: file.name,
        type: file.type,
        size: file.size,
        data: reader.result
      });
      renderAttachmentBar();
    };
    reader.onerror = () => toast('File read error', 'error');
    reader.readAsDataURL(file);
  }
}

function renderAttachmentBar() {
  const bar = $('#attachment-bar');
  if (!bar) return;
  if (AppState.attachments.length === 0) {
    bar.hidden = true;
    bar.innerHTML = '';
    return;
  }
  bar.hidden = false;
  bar.innerHTML = '';
  AppState.attachments.forEach((att, i) => {
    const item = el('div', { class: 'att-item' });
    if (att.type && att.type.startsWith('image/') && att.data) {
      item.appendChild(el('img', { src: att.data, alt: escapeHtml(att.name) }));
    } else {
      item.appendChild(el('span', {
        html: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
      }));
    }
    const remove = el('button', { class: 'att-remove', type: 'button', 'aria-label': 'Remove', text: '×' });
    remove.addEventListener('click', () => {
      AppState.attachments.splice(i, 1);
      renderAttachmentBar();
    });
    item.appendChild(remove);
    bar.appendChild(item);
  });
}

/* ---------------- TEXTAREA AUTO-RESIZE ---------------- */

let resizeTimer = null;
function autoResizeInput() {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const input = $('#msg-input');
    if (!input) return;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  }, DEBOUNCE_MS);
}

/* ---------------- TOOL PALETTE ---------------- */

function renderToolPalette() {
  const grid = $('#tool-grid');
  if (!grid) return;
  grid.innerHTML = '';
  TOOLS.forEach(t => {
    const item = el('button', { class: 'tool-item', type: 'button' });
    item.appendChild(el('div', { class: 'tool-item-icon', html: t.icon }));
    item.appendChild(el('div', { class: 'tool-item-label', text: t.name }));
    item.appendChild(el('div', { class: 'tool-item-desc', text: t.desc }));
    item.addEventListener('click', () => triggerTool(t.id));
    grid.appendChild(item);
  });
}

function toggleToolPalette(forceState) {
  const palette = $('#tool-palette');
  const btn = $('#btn-tools');
  if (!palette || !btn) return;
  const next = typeof forceState === 'boolean' ? forceState : !AppState.toolPaletteOpen;
  AppState.toolPaletteOpen = next;
  palette.classList.toggle('open', next);
  btn.setAttribute('aria-expanded', next ? 'true' : 'false');
}

function triggerTool(id) {
  const tool = TOOLS.find(t => t.id === id);
  if (!tool) return;
  const input = $('#msg-input');
  if (!input) return;

  toggleToolPalette(false);

  if (tool.handler) {
    runLocalTool(tool.handler);
    return;
  }

  if (tool.prefix) {
    if (!input.value.startsWith(tool.prefix)) {
      input.value = tool.prefix + input.value;
    }
    autoResizeInput();
    input.focus();
  }
}

/* ---------------- LOCAL TOOLS ---------------- */

async function runLocalTool(handler) {
  if (handler === 'localHash') return runLocalHash();
  if (handler === 'localWordCount') return runLocalWordCount();
  if (handler === 'localExport') return runLocalExport();
}

async function runLocalHash() {
  const input = $('#msg-input');
  const text = (input && input.value) || '';
  if (!text.trim()) { toast('Enter text in message field', 'warning'); return; }
  try {
    const buf = new TextEncoder().encode(text);
    const hashBuf = await crypto.subtle.digest('SHA-256', buf);
    const hash = Array.from(new Uint8Array(hashBuf))
      .map(b => b.toString(16).padStart(2, '0')).join('');
    openInfoModal({
      title: 'SHA-256 Hash',
      body: `Input:\n${text}\n\nHash:\n${hash}`
    });
  } catch (err) {
    toast('Hash generation error: ' + err.message, 'error');
  }
}

function runLocalWordCount() {
  const input = $('#msg-input');
  const text = (input && input.value) || '';
  const chars = text.length;
  const charsNoSpace = text.replace(/\s/g, '').length;
  const words = (text.trim().match(/\S+/g) || []).length;
  const lines = text ? text.split(/\r?\n/).length : 0;
  const sentences = (text.match(/[.!?]+/g) || []).length;
  openInfoModal({
    title: 'Text Statistics',
    body: `Characters: ${chars}\nCharacters (no spaces): ${charsNoSpace}\nWords: ${words}\nLines: ${lines}\nSentences (approx): ${sentences}`
  });
}

function runLocalExport() {
  const chat = getCurrentChat();
  if (!chat.messages.length) { toast('Mission is empty', 'warning'); return; }

  openChoiceModal({
    title: 'Export Mission',
    options: [
      { id: 'txt', label: 'Text (.txt)' },
      { id: 'json', label: 'JSON (.json)' },
      { id: 'pdf', label: 'Print / PDF' }
    ],
    onSelect: (id) => doExport(id, chat)
  });
}

function doExport(format, chat) {
  const title = chat.title || 'mission';
  if (format === 'txt') {
    const lines = chat.messages.map(m =>
      `[${m.role === 'user' ? 'GROUND CONTROL' : 'MISSION CONTROL'}]\n${m.content || ''}`
    ).join('\n\n---\n\n');
    downloadBlob(new Blob([lines], { type: 'text/plain;charset=utf-8' }), `${slugify(title)}.txt`);
  } else if (format === 'json') {
    const blob = new Blob([JSON.stringify(chat, null, 2)], { type: 'application/json' });
    downloadBlob(blob, `${slugify(title)}.json`);
  } else if (format === 'pdf') {
    const w = window.open('', '_blank');
    if (!w) { toast('Popup blocked by browser', 'error'); return; }
    const html = chat.messages.map(m =>
      `<h3 style="color:${m.role==='user'?'#00b4d8':'#00ff88'}">${m.role==='user'?'GROUND CONTROL':'MISSION CONTROL'}</h3>${parseMarkdown(m.content||'')}`
    ).join('<hr>');
    w.document.write(`<!DOCTYPE html><html><head><title>${escapeHtml(title)}</title>
      <style>body{font-family:system-ui;padding:40px;line-height:1.6;max-width:800px;margin:0 auto;}
      h3{margin-top:20px;font-family:monospace;text-transform:uppercase;}pre{background:#0a0e27;color:#a8d8b9;padding:12px;border-radius:6px;overflow-x:auto;}
      code{background:#0a0e27;color:#ffb800;padding:1px 4px;border-radius:3px;}</style>
      </head><body><h1>${escapeHtml(title)}</h1>${html}</body></html>`);
    w.document.close();
    setTimeout(() => w.print(), 300);
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Exported: ${filename}`, 'success');
}

function slugify(s) {
  return (s || 'mission').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'mission';
}

/* ---------------- MODALS ---------------- */

function openModal(contentBuilder) {
  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' });
  contentBuilder(modal, overlay);
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  return { overlay, modal };
}

function openConfirmModal({ title, message, confirmText = 'Confirm', danger = false, onConfirm }) {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: title }));
    modal.appendChild(el('p', { text: message, style: 'color:var(--text-secondary);line-height:1.6;' }));
    const actions = el('div', { class: 'modal-actions' });
    const cancel = el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Cancel' });
    cancel.addEventListener('click', () => overlay.remove());
    const confirm = el('button', { class: 'btn ' + (danger ? 'btn-danger' : 'btn-primary'), type: 'button', text: confirmText });
    confirm.addEventListener('click', () => { overlay.remove(); if (typeof onConfirm === 'function') onConfirm(); });
    actions.appendChild(cancel);
    actions.appendChild(confirm);
    modal.appendChild(actions);
  });
}

function openPromptModal({ title, placeholder, defaultValue = '', optional = false, onSubmit }) {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: title }));
    const textarea = el('textarea', {
      class: 'textarea-field',
      rows: '3',
      placeholder: placeholder || ''
    });
    textarea.value = defaultValue || '';
    modal.appendChild(textarea);
    const actions = el('div', { class: 'modal-actions' });
    const cancel = el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Cancel' });
    cancel.addEventListener('click', () => overlay.remove());
    const submit = el('button', { class: 'btn btn-primary', type: 'button', text: 'Save' });
    submit.addEventListener('click', () => {
      const val = textarea.value.trim();
      if (!val && !optional) { toast('Field cannot be empty', 'warning'); return; }
      overlay.remove();
      if (typeof onSubmit === 'function') onSubmit(val);
    });
    actions.appendChild(cancel);
    actions.appendChild(submit);
    modal.appendChild(actions);
    setTimeout(() => textarea.focus(), 50);
  });
}

function openInfoModal({ title, body }) {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: title }));
    modal.appendChild(el('pre', { text: body, style: 'background:var(--space-void);color:var(--text-terminal);padding:14px;border-radius:8px;overflow:auto;max-height:400px;font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;border:1px solid var(--border-normal);' }));
    const actions = el('div', { class: 'modal-actions' });
    const close = el('button', { class: 'btn btn-primary', type: 'button', text: 'Close' });
    close.addEventListener('click', () => overlay.remove());
    actions.appendChild(close);
    modal.appendChild(actions);
  });
}

function openChoiceModal({ title, options, onSelect }) {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: title }));
    const grid = el('div', { style: 'display:flex;flex-direction:column;gap:8px;margin-top:10px;' });
    options.forEach(o => {
      const b = el('button', { class: 'btn btn-secondary-modal', type: 'button', text: o.label, style: 'justify-content:flex-start;' });
      b.addEventListener('click', () => { overlay.remove(); onSelect(o.id); });
      grid.appendChild(b);
    });
    modal.appendChild(grid);
    const actions = el('div', { class: 'modal-actions' });
    const cancel = el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Cancel' });
    cancel.addEventListener('click', () => overlay.remove());
    actions.appendChild(cancel);
    modal.appendChild(actions);
  });
}

/* ---------------- SETTINGS ---------------- */

function openSettings() {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: '⚙ Configuration' }));

    // Temperature
    const tempRow = el('div', { class: 'slider-row' });
    const tempHead = el('div', { class: 'slider-row-head' });
    tempHead.appendChild(el('span', { class: 'toggle-label', text: 'Temperature' }));
    const tempVal = el('span', { class: 'slider-val', text: String(AppState.settings.temperature) });
    tempHead.appendChild(tempVal);
    tempRow.appendChild(tempHead);
    const tempSlider = el('input', { type: 'range', class: 'range-slider', min: '0', max: '2', step: '0.1', value: String(AppState.settings.temperature) });
    tempSlider.addEventListener('input', () => { tempVal.textContent = tempSlider.value; });
    tempRow.appendChild(tempSlider);
    modal.appendChild(tempRow);

    // Max tokens
    const tokensRow = el('div', { class: 'slider-row' });
    const tokensHead = el('div', { class: 'slider-row-head' });
    tokensHead.appendChild(el('span', { class: 'toggle-label', text: 'Max Tokens' }));
    const tokensVal = el('span', { class: 'slider-val', text: String(AppState.settings.maxTokens) });
    tokensHead.appendChild(tokensVal);
    tokensRow.appendChild(tokensHead);
    const tokensSlider = el('input', { type: 'range', class: 'range-slider', min: '256', max: '8192', step: '256', value: String(AppState.settings.maxTokens) });
    tokensSlider.addEventListener('input', () => { tokensVal.textContent = tokensSlider.value; });
    tokensRow.appendChild(tokensSlider);
    modal.appendChild(tokensRow);

    // Follow-up toggle
    const followRow = el('div', { class: 'toggle-row' });
    followRow.appendChild(el('span', { class: 'toggle-label', text: 'Auto follow-up suggestions' }));
    const followToggle = el('div', { class: 'toggle' + (AppState.settings.followUpEnabled ? ' on' : '') });
    followToggle.addEventListener('click', () => followToggle.classList.toggle('on'));
    followRow.appendChild(followToggle);
    modal.appendChild(followRow);

    // Follow-up count
    const countRow = el('div', { class: 'slider-row' });
    const countHead = el('div', { class: 'slider-row-head' });
    countHead.appendChild(el('span', { class: 'toggle-label', text: 'Follow-up count' }));
    const countVal = el('span', { class: 'slider-val', text: String(AppState.settings.followUpCount) });
    countHead.appendChild(countVal);
    countRow.appendChild(countHead);
    const countSlider = el('input', { type: 'range', class: 'range-slider', min: '1', max: '5', step: '1', value: String(AppState.settings.followUpCount) });
    countSlider.addEventListener('input', () => { countVal.textContent = countSlider.value; });
    countRow.appendChild(countSlider);
    modal.appendChild(countRow);

    // Global system prompt
    const promptGroup = el('div', { style: 'margin-top:8px;' });
    promptGroup.appendChild(el('label', { class: 'input-label', text: 'Global System Prompt' }));
    const promptArea = el('textarea', { class: 'textarea-field', rows: '4' });
    promptArea.value = AppState.settings.globalSystemPrompt || '';
    promptGroup.appendChild(promptArea);
    modal.appendChild(promptGroup);

    const actions = el('div', { class: 'modal-actions' });
    const cancel = el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Cancel' });
    cancel.addEventListener('click', () => overlay.remove());
    const save = el('button', { class: 'btn btn-primary', type: 'button', text: 'Save Config' });
    save.addEventListener('click', () => {
      AppState.settings.temperature = parseFloat(tempSlider.value);
      AppState.settings.maxTokens = parseInt(tokensSlider.value, 10);
      AppState.settings.followUpEnabled = followToggle.classList.contains('on');
      AppState.settings.followUpCount = parseInt(countSlider.value, 10);
      AppState.settings.globalSystemPrompt = promptArea.value;
      saveState();
      overlay.remove();
      toast('Configuration saved', 'success');
    });
    actions.appendChild(cancel);
    actions.appendChild(save);
    modal.appendChild(actions);
  });
}

/* ---------------- THEME ---------------- */

function toggleTheme() {
  const current = AppState.theme;
  if (current === 'auto') AppState.theme = 'dark';
  else if (current === 'dark') AppState.theme = 'light';
  else AppState.theme = 'auto';
  applyTheme();
  saveState();
  toast(`Theme: ${AppState.theme}`, 'info');
}

function applyTheme() {
  const theme = AppState.theme;
  if (theme === 'auto') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
  updateThemeIcon();
}

function updateThemeIcon() {
  const icon = $('#theme-icon');
  if (!icon) return;
  const isDark = AppState.theme === 'dark' ||
    (AppState.theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);

  if (isDark) {
    // Moon icon
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    // Sun icon
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
}

/* ---------------- SIDEBAR TOGGLE ---------------- */

function openSidebar() { $('#sidebar').classList.add('open'); $('#sidebar-backdrop').classList.add('show'); }
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#sidebar-backdrop').classList.remove('show'); }
function toggleSidebar() { $('#sidebar').classList.contains('open') ? closeSidebar() : openSidebar(); }

/* ---------------- CLOCK ---------------- */

function updateClock() {
  const clockEl = $('#header-clock');
  if (!clockEl) return;
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  clockEl.textContent = `${h}:${m}:${s}`;
}

/* ---------------- EVENT BINDING (DR-6) ---------------- */

const listenerCleanup = [];

function bindEvents() {
  const on = (target, event, handler, options) => {
    target.addEventListener(event, handler, options);
    listenerCleanup.push(() => target.removeEventListener(event, handler, options));
  };

  on($('#btn-new-mission'), 'click', newMission);
  on($('#menu-toggle'), 'click', toggleSidebar);
  on($('#sidebar-backdrop'), 'click', closeSidebar);

  $$('#mode-selector .mode-btn').forEach(btn => {
    on(btn, 'click', () => setMode(btn.dataset.mode));
  });

  on($('#btn-settings'), 'click', openSettings);
  on($('#btn-help'), 'click', openHelp);
  on($('#btn-theme'), 'click', toggleTheme);
  on($('#btn-save-mission'), 'click', saveCurrentMission);

  $$('[data-load]').forEach(btn => {
    on(btn, 'click', () => loadModels(btn.dataset.load));
  });

  ['mistral', 'groq', 'google'].forEach(p => {
    const keyEl = $(`#api-key-${p}`);
    if (keyEl) {
      on(keyEl, 'change', () => {
        AppState.providers[p].apiKey = keyEl.value.trim();
        saveState();
        updateUplinkStatus();
      });
    }
    const modelEl = $(`#model-${p}`);
    if (modelEl) {
      on(modelEl, 'change', () => {
        AppState.providers[p].selectedModel = modelEl.value;
        if (p === 'groq') {
          const rGroup = $('#reasoning-groq-group');
          const isReasoning = /deepseek-r1|qwen/i.test(modelEl.value);
          if (rGroup) rGroup.hidden = !isReasoning;
        }
        saveState();
        updateUplinkStatus();
      });
    }
  });

  const reasoningEl = $('#reasoning-groq');
  if (reasoningEl) {
    on(reasoningEl, 'change', () => {
      AppState.providers.groq.reasoning = reasoningEl.value;
      saveState();
    });
  }

  const globalPrompt = $('#system-prompt');
  if (globalPrompt) {
    on(globalPrompt, 'change', () => {
      AppState.settings.globalSystemPrompt = globalPrompt.value;
      saveState();
    });
  }

  const msgInput = $('#msg-input');
  on(msgInput, 'input', autoResizeInput);
  on(msgInput, 'keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  on($('#send-btn'), 'click', () => {
    if (AppState.isLoading) stopGeneration();
    else sendMessage();
  });

  on($('#btn-attach'), 'click', () => $('#file-input').click());
  on($('#file-input'), 'change', (e) => {
    handleFiles(e.target.files);
    e.target.value = '';
  });

  on($('#btn-tools'), 'click', () => toggleToolPalette());

  on(document, 'click', (e) => {
    if (!AppState.toolPaletteOpen) return;
    const palette = $('#tool-palette');
    const btn = $('#btn-tools');
    if (palette && !palette.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
      toggleToolPalette(false);
    }
  });

  // Copy code (delegated)
  on(document, 'click', async (e) => {
    const btn = e.target.closest('[data-copy-code]');
    if (!btn) return;
    const block = btn.closest('.code-block');
    const code = block && block.querySelector('code');
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code.textContent || '');
      const original = btn.innerHTML;
      btn.textContent = '✓ Copied';
      setTimeout(() => { btn.innerHTML = original; }, 1500);
    } catch { toast('Copy failed', 'error'); }
  });

  // Keyboard shortcuts
  on(document, 'keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
      e.preventDefault();
      newMission();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      saveCurrentMission();
    }
    if (e.key === 'Escape') {
      const modal = document.querySelector('.modal-overlay');
      if (modal) modal.remove();
      else if (AppState.toolPaletteOpen) toggleToolPalette(false);
      else if ($('#sidebar').classList.contains('open')) closeSidebar();
    }
  });

  // System theme change
  const mql = window.matchMedia('(prefers-color-scheme: dark)');
  const themeHandler = () => { if (AppState.theme === 'auto') updateThemeIcon(); };
  mql.addEventListener('change', themeHandler);
  listenerCleanup.push(() => mql.removeEventListener('change', themeHandler));
}

/* ---------------- RESTORE UI STATE ---------------- */

function restoreUiState() {
  ['mistral', 'groq', 'google'].forEach(p => {
    const keyEl = $(`#api-key-${p}`);
    if (keyEl && AppState.providers[p].apiKey) keyEl.value = AppState.providers[p].apiKey;
    const modelEl = $(`#model-${p}`);
    if (modelEl && AppState.providers[p].selectedModel) {
      modelEl.value = AppState.providers[p].selectedModel;
      if (p === 'groq') {
        const rGroup = $('#reasoning-groq-group');
        const isReasoning = /deepseek-r1|qwen/i.test(modelEl.value);
        if (rGroup) rGroup.hidden = !isReasoning;
      }
    }
    if (AppState.providers[p].models && AppState.providers[p].models.length > 0) {
      const dot = $(`#status-${p}`);
      const card = $(`#card-${p}`);
      if (dot) dot.classList.add('online');
      if (card) card.classList.add('connected');
    }
  });

  const reasoningEl = $('#reasoning-groq');
  if (reasoningEl && AppState.providers.groq.reasoning) {
    reasoningEl.value = AppState.providers.groq.reasoning;
  }

  const globalPrompt = $('#system-prompt');
  if (globalPrompt) globalPrompt.value = AppState.settings.globalSystemPrompt || '';

  setMode(AppState.currentMode || 'erik', true);
  applyTheme();
  updateUplinkStatus();
}

/* ---------------- BOOTSTRAP ---------------- */

function init() {
  loadState();
  renderToolPalette();
  restoreUiState();

  // Ensure an active mission exists
  if (!AppState.currentChatId || !AppState.chats.has(AppState.currentChatId)) {
    if (AppState.chats.size === 0) {
      createNewMission();
    } else {
      // Resume most recent saved mission
      const sorted = Array.from(AppState.chats.values())
        .filter(c => c.saved)
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      if (sorted.length > 0) {
        AppState.currentChatId = sorted[0].id;
      } else {
        createNewMission();
      }
    }
  }

  renderChatLists();
  renderMessages();
  renderSaveIndicator();
  bindEvents();

  // Start clock
  updateClock();
  setInterval(updateClock, 1000);

  // Focus input on desktop
  setTimeout(() => {
    const input = $('#msg-input');
    if (input && window.innerWidth > 900) input.focus();
  }, 300);

  // Warn before leaving with unsaved ephemeral missions
  window.addEventListener('beforeunload', (e) => {
    const hasUnsavedWithMessages = Array.from(AppState.chats.values())
      .some(c => !c.saved && c.messages.length > 0);
    if (hasUnsavedWithMessages) {
      e.preventDefault();
      e.returnValue = 'You have unsaved missions that will be lost.';
      return e.returnValue;
    }
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
