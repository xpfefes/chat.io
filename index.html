        <div class="input-footer">NAXA v6.0 — Intel Blue • Multi-provider AI</div>
      </div>
    </div>
  </main>
</div>

<div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>

<script>
'use strict';

/* ==========================================================================
   NAXA v6.0 — Intel Blue Theme | Optimized Build
   ========================================================================== */

// === CONSTANTS ===
const C = Object.freeze({
  STORAGE_KEY: 'naxa-v6-intel-blue',
  MAX_SAVED: 200,
  TOAST_MS: 3200,
  DEBOUNCE: 60,
  FETCH_TIMEOUT: 45000,
  AUTO_SAVE: 25000,
  RENDER_LIMIT: 150,
  SEARCH_DEBOUNCE: 200
});

// === SYSTEM PROMPTS ===
const SYSTEM_PROMPTS = Object.freeze({
  erik: `Sei ErikAI Developer, assistente senior di ingegneria software.
PROCESSO OBBLIGATORIO: 1.ANALISI 2.ARCHITETTURA 3.PIANO 4.IMPLEMENTAZIONE 5.VERIFICA.
REGOLE: Mai codice incompleto. Null/empty gestiti. Complessità dichiarata. Italiano testo, inglese codice.`,
  assistant: `Sei un assistente AI utile e competente. Rispondi chiaro e conciso. Adatta lo stile. Se non sicuro, ammettilo. Usa markdown.`,
  coder: `Sei un esperto sviluppatore. Versioni recenti. SOLID. Leggibile. Casi limite gestiti. Ottimizza solo quando rilevante.`,
  support: `Assistente supporto tecnico paziente. Comprendi con domande. Soluzioni passo-passo. Linguaggio semplice.`
});

// === PROMPT SUGGESTIONS ===
const PROMPTS = [
  { title: 'Quantum Computing', desc: 'Explain in simple terms', prompt: 'Explain quantum computing in simple terms' },
  { title: 'Python Automation', desc: 'File organization script', prompt: 'Write a Python script to organize files by extension' },
  { title: 'System Design', desc: 'Architecture patterns', prompt: 'Explain microservices vs monolith architecture' },
  { title: 'Debug Help', desc: 'Fix this code', prompt: 'Help me debug this code:' }
];

// === EVENT BUS (optimized) ===
const Bus = (() => {
  const h = new Map();
  return {
    on(e, fn) {
      if (!h.has(e)) h.set(e, new Set());
      h.get(e).add(fn);
      return () => h.get(e)?.delete(fn);
    },
    emit(e, p) {
      h.get(e)?.forEach(fn => { try { fn(p); } catch(err) { console.error(`Bus[${e}]:`, err); } });
    }
  };
})();

// === APP STATE ===
const State = {
  currentChatId: null,
  currentMode: 'assistant',
  currentProvider: 'mistral',
  currentModel: '',
  theme: 'auto',
  sidebarOpen: true,
  searchQuery: '',
  providers: {
    mistral: { name: 'Mistral', apiKey: '', models: [], selectedModel: '', baseUrl: 'https://api.mistral.ai/v1', compatible: 'openai' },
    groq: { name: 'Groq', apiKey: '', models: [], selectedModel: '', baseUrl: 'https://api.groq.com/openai/v1', compatible: 'openai' },
    google: { name: 'Google AI', apiKey: '', models: [], selectedModel: '', baseUrl: 'https://generativelanguage.googleapis.com/v1beta', compatible: 'google' },
    openai: { name: 'OpenAI', apiKey: '', models: [], selectedModel: '', baseUrl: 'https://api.openai.com/v1', compatible: 'openai' }
  },
  customProviders: new Map(),
  settings: {
    temperature: 0.7, maxTokens: 2048, followUpEnabled: false, followUpCount: 3,
    globalSystemPrompt: '', ttsEnabled: false, ttsVoice: null, autoSaveDrafts: true,
    sendOnEnter: true, streamEnabled: true
  },
  chats: new Map(),
  attachments: [],
  isLoading: false,
  abortController: null,
  missionCounter: 0,
  stats: { totalMessages: 0, totalTokens: 0, totalMissions: 0, avgResponseTime: 0 },
  // Cache for performance
  _renderCache: new Map(),
  _mdCache: new Map()
};

// === DOM HELPERS (optimized) ===
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, String(v));
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}

// === MARKDOWN (cached) ===
function escapeHtml(s) {
  if (typeof s !== 'string') return '';
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return s.replace(/[&<>"']/g, c => map[c]);
}

function parseMD(text) {
  if (typeof text !== 'string' || !text) return '';
  
  // Check cache
  const cacheKey = text.slice(0, 500);
  if (State._mdCache.has(cacheKey)) return State._mdCache.get(cacheKey);
  
  let s = escapeHtml(text);
  
  // Code blocks
  s = s.replace(/```(\w+)?\n([\s\S]*?)```/g, (_, lang, code) => {
    const label = escapeHtml((lang || 'text').toLowerCase());
    const btn = `<button class="copy-code-btn" data-copy-code="1" type="button"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button>`;
    return `<div class="code-block"><div class="code-block-head"><span>${label}</span>${btn}</div><pre><code>${code.trim()}</code></pre></div>`;
  });
  
  // Inline code
  s = s.replace(/`([^`\n]+)`/g, '<span class="inline-code">$1</span>');
  // Headers
  s = s.replace(/^### (.*$)/gim, '<h3>$1</h3>');
  s = s.replace(/^## (.*$)/gim, '<h2>$1</h2>');
  s = s.replace(/^# (.*$)/gim, '<h1>$1</h1>');
  // Bold/Italic
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Links
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, l, u) => {
    const safe = /^(https?|mailto):/i.test(u) ? u : '#';
    return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${l}</a>`;
  });
  // Lists
  s = s.replace(/^(?:[-*+]) (.+)$/gim, '<li>$1</li>');
  s = s.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
  // Paragraphs
  const blocks = s.split(/\n{2,}/).map(b => {
    const t = b.trim();
    if (!t) return '';
    if (/^<(h[1-3]|ul|ol|div|pre|code)/.test(t)) return t;
    return `<p>${t.replace(/\n/g, '<br>')}</p>`;
  });
  
  const result = blocks.filter(Boolean).join('');
  
  // Cache (limit to 100 entries)
  if (State._mdCache.size > 100) State._mdCache.clear();
  State._mdCache.set(cacheKey, result);
  
  return result;
}

// === TOAST ===
const TOAST_ICONS = {
  success: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
  error: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
  warning: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  info: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
};

function toast(msg, type = 'info') {
  const stack = $('#toast-stack');
  if (!stack || typeof msg !== 'string' || !msg) return;
  const n = el('div', { class: `toast ${type}`, role: 'status' }, [
    el('span', { class: 'toast-icon', html: TOAST_ICONS[type] || TOAST_ICONS.info }),
    el('span', { text: msg })
  ]);
  stack.appendChild(n);
  setTimeout(() => { n.classList.add('out'); setTimeout(() => n.remove(), 260); }, C.TOAST_MS);
}

// === PERSISTENCE ===
function serialize() {
  const savedChats = [...State.chats.values()].filter(c => c.saved || c.pinned).map(c => ({
    id: c.id, title: c.title, messages: c.messages, mode: c.mode, saved: c.saved,
    pinned: c.pinned || false, createdAt: c.createdAt, updatedAt: c.updatedAt,
    likeFeedback: c.likeFeedback, dislikeFeedback: c.dislikeFeedback,
    tags: c.tags || [], provider: c.provider, model: c.model
  }));
  
  const customs = [...State.customProviders.entries()].map(([id, p]) => ({
    id, name: p.name, baseUrl: p.baseUrl, apiKey: p.apiKey,
    models: p.models, selectedModel: p.selectedModel, compatible: p.compatible || 'openai'
  }));

  return {
    version: 6, providers: State.providers, customProviders: customs, settings: State.settings,
    chats: savedChats, currentProvider: State.currentProvider, currentModel: State.currentModel,
    currentMode: State.currentMode, theme: State.theme, sidebarOpen: State.sidebarOpen,
    missionCounter: State.missionCounter, stats: State.stats
  };
}

let saveTimer = null;
function save() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(C.STORAGE_KEY, JSON.stringify(serialize()));
    } catch (err) {
      if (err?.name === 'QuotaExceededError' || /quota/i.test(err.message || '')) {
        toast('Storage full: pruning old data', 'warning');
        pruneOld();
        try { localStorage.setItem(C.STORAGE_KEY, JSON.stringify(serialize())); } catch {}
      }
    }
  }, 250);
}

function pruneOld() {
  const saved = [...State.chats.values()].filter(c => c.saved);
  if (saved.length <= C.MAX_SAVED) return;
  saved.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(C.MAX_SAVED).forEach(c => {
    const chat = State.chats.get(c.id);
    if (chat) chat.saved = false;
  });
}

function load() {
  try {
    const raw = localStorage.getItem(C.STORAGE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || typeof d !== 'object') return false;

    if (d.providers) {
      for (const k of Object.keys(State.providers)) {
        if (d.providers[k]) {
          State.providers[k].apiKey = String(d.providers[k].apiKey || '');
          State.providers[k].selectedModel = String(d.providers[k].selectedModel || '');
        }
      }
    }

    if (Array.isArray(d.customProviders)) {
      State.customProviders = new Map();
      for (const p of d.customProviders) {
        if (p?.id) State.customProviders.set(p.id, {
          name: String(p.name || 'Custom'), baseUrl: String(p.baseUrl || ''),
          apiKey: String(p.apiKey || ''), models: Array.isArray(p.models) ? p.models : [],
          selectedModel: String(p.selectedModel || ''), compatible: String(p.compatible || 'openai')
        });
      }
    }

    if (d.settings) State.settings = { ...State.settings, ...d.settings };

    if (Array.isArray(d.chats)) {
      State.chats = new Map();
      for (const c of d.chats) {
        if (c?.id) State.chats.set(c.id, {
          id: c.id, title: String(c.title || 'Untitled'),
          messages: Array.isArray(c.messages) ? c.messages : [],
          mode: SYSTEM_PROMPTS[c.mode] ? c.mode : 'assistant',
          saved: !!c.saved, pinned: !!c.pinned,
          createdAt: Number(c.createdAt) || Date.now(), updatedAt: Number(c.updatedAt) || Date.now(),
          likeFeedback: c.likeFeedback || null, dislikeFeedback: c.dislikeFeedback || null,
          tags: Array.isArray(c.tags) ? c.tags : [], provider: c.provider || null, model: c.model || null
        });
      }
    }

    if (d.currentMode && SYSTEM_PROMPTS[d.currentMode]) State.currentMode = d.currentMode;
    if (typeof d.currentProvider === 'string') State.currentProvider = d.currentProvider;
    if (typeof d.currentModel === 'string') State.currentModel = d.currentModel;
    if (typeof d.theme === 'string') State.theme = d.theme;
    if (typeof d.sidebarOpen === 'boolean') State.sidebarOpen = d.sidebarOpen;
    if (typeof d.missionCounter === 'number') State.missionCounter = d.missionCounter;
    if (d.stats) State.stats = { ...State.stats, ...d.stats };
    return true;
  } catch (err) { console.error('load:', err); return false; }
}

// === CHAT MANAGEMENT ===
function createNew() {
  State.missionCounter++;
  const id = `c_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
  const chat = {
    id, title: 'New chat', messages: [], mode: State.currentMode,
    saved: false, pinned: false, createdAt: Date.now(), updatedAt: Date.now(),
    likeFeedback: null, dislikeFeedback: null, tags: [],
    provider: State.currentProvider, model: State.currentModel
  };
  State.chats.set(id, chat);
  State.currentChatId = id;
  return chat;
}

function getChat() {
  if (!State.currentChatId || !State.chats.has(State.currentChatId)) return createNew();
  return State.chats.get(State.currentChatId);
}

function saveCurrent() {
  const chat = getChat();
  if (!chat.messages.length) { toast('Empty chat cannot be saved', 'warning'); return; }
  chat.saved = true; chat.updatedAt = Date.now(); save(); renderLists(); toast('Chat saved', 'success');
}

function newChat() { createNew(); renderLists(); renderMessages(); renderAttachBar(); toast('New chat started', 'info'); }

function selectChat(id) {
  if (typeof id !== 'string' || !State.chats.has(id)) return;
  State.currentChatId = id;
  const chat = State.chats.get(id);
  if (chat) {
    if (chat.mode) setMode(chat.mode, true);
    if (chat.provider) State.currentProvider = chat.provider;
    if (chat.model) State.currentModel = chat.model;
  }
  renderLists(); renderMessages(); closeSidebar(); updateModel();
}

function deleteChat(id, ev) {
  if (ev) ev.stopPropagation();
  if (typeof id !== 'string') return;
  const chat = State.chats.get(id);
  confirmModal({
    title: 'Delete chat?',
    message: chat?.saved ? 'This will permanently delete this saved chat.' : 'This chat will be permanently deleted.',
    confirm: 'Delete', danger: true,
    onConfirm: () => {
      State.chats.delete(id);
      if (State.currentChatId === id) createNew();
      save(); renderLists(); renderMessages(); toast('Deleted', 'success');
    }
  });
}

function renameChat(id, ev) {
  if (ev) ev.stopPropagation();
  if (typeof id !== 'string' || !State.chats.has(id)) return;
  const chat = State.chats.get(id);
  promptModal({
    title: 'Rename chat', placeholder: 'Chat title', value: chat.title,
    onSubmit: (val) => {
      const t = (val || '').trim();
      if (!t) return;
      chat.title = t.slice(0, 80); chat.updatedAt = Date.now(); save(); renderLists(); toast('Renamed', 'success');
    }
  });
}

function togglePin(id, ev) {
  if (ev) ev.stopPropagation();
  if (typeof id !== 'string' || !State.chats.has(id)) return;
  const chat = State.chats.get(id);
  chat.pinned = !chat.pinned;
  chat.updatedAt = Date.now();
  save(); renderLists();
  toast(chat.pinned ? 'Pinned' : 'Unpinned', 'info');
}

// === SEARCH ===
function filterChats(query) {
  State.searchQuery = (query || '').toLowerCase().trim();
  renderLists();
}

function matchesSearch(chat) {
  if (!State.searchQuery) return true;
  const q = State.searchQuery;
  if (chat.title.toLowerCase().includes(q)) return true;
  return chat.messages.some(m => (m.content || '').toLowerCase().includes(q));
}

// === RENDERING ===
function renderLists() {
  renderList($('#pinned-chat-list'), 'pinned');
  renderList($('#active-chat-list'), 'recent');
  renderList($('#saved-chat-list'), 'saved');
}

function renderList(container, type) {
  if (!container) return;
  container.innerHTML = '';

  let chats = [...State.chats.values()];
  
  // Filter by type
  if (type === 'pinned') chats = chats.filter(c => c.pinned);
  else if (type === 'saved') chats = chats.filter(c => c.saved && !c.pinned);
  else chats = chats.filter(c => !c.saved && !c.pinned);
  
  // Filter by search
  chats = chats.filter(matchesSearch);
  
  // Sort & limit
  chats.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 50);

  if (!chats.length) {
    const hints = { pinned: 'No pinned chats', saved: 'No saved chats', recent: State.searchQuery ? 'No results' : 'No recent chats' };
    container.appendChild(el('div', { class: 'empty-hint', text: hints[type] }));
    return;
  }

  const frag = document.createDocumentFragment();
  for (const chat of chats) {
    const active = chat.id === State.currentChatId;
    const item = el('div', {
      class: `chat-item${active ? ' active' : ''}${chat.pinned ? ' pinned' : ''}`,
      role: 'button', tabindex: '0'
    });

    item.appendChild(el('span', { class: 'chat-item-icon', html: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' }));
    item.appendChild(el('span', { class: 'chat-item-title', text: chat.title }));

    const actions = el('div', { class: 'chat-item-actions' });
    
    const pinBtn = el('button', { class: `btn-icon${chat.pinned ? ' active' : ''}`, type: 'button', 'aria-label': 'Pin' },
      [el('span', { html: '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5v6l1 1 1-1v-6h5v-2z"/></svg>' })]);
    pinBtn.addEventListener('click', (e) => togglePin(chat.id, e));
    
    const renameBtn = el('button', { class: 'btn-icon', type: 'button', 'aria-label': 'Rename' },
      [el('span', { html: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>' })]);
    renameBtn.addEventListener('click', (e) => renameChat(chat.id, e));
    
    const delBtn = el('button', { class: 'btn-icon danger', type: 'button', 'aria-label': 'Delete' },
      [el('span', { html: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>' })]);
    delBtn.addEventListener('click', (e) => deleteChat(chat.id, e));

    actions.append(pinBtn, renameBtn, delBtn);
    item.appendChild(actions);
    item.addEventListener('click', () => selectChat(chat.id));
    item.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectChat(chat.id); } });
    frag.appendChild(item);
  }
  container.appendChild(frag);
}

function renderMessages() {
  const container = $('#chat-messages');
  if (!container) return;
  const chat = getChat();
  const msgs = chat.messages || [];

  if (!msgs.length) {
    container.innerHTML = '';
    renderEmpty(container);
    return;
  }

  // Optimized: only re-render if changed
  const cacheKey = `${chat.id}_${msgs.length}`;
  if (State._renderCache.get('lastKey') !== cacheKey || State.isLoading) {
    container.innerHTML = '';
    const frag = document.createDocumentFragment();
    msgs.slice(-C.RENDER_LIMIT).forEach((m, i) => frag.appendChild(renderMsg(m, i + Math.max(0, msgs.length - C.RENDER_LIMIT))));
    container.appendChild(frag);
    State._renderCache.set('lastKey', cacheKey);
  }
  requestAnimationFrame(scrollBottom);
}

function renderEmpty(container) {
  const w = el('div', { class: 'empty-state' });
  w.appendChild(el('div', { class: 'empty-logo', text: 'N' }));
  w.appendChild(el('h1', { class: 'empty-title', text: 'How can I help you today?' }));
  w.appendChild(el('p', { class: 'empty-subtitle', text: 'Powered by multiple AI providers. Intel Blue edition.' }));
  
  const sg = el('div', { class: 'prompt-suggestions' });
  PROMPTS.forEach(s => {
    const card = el('button', { class: 'prompt-card', type: 'button' });
    card.appendChild(el('div', { class: 'prompt-card-title', text: s.title }));
    card.appendChild(el('div', { class: 'prompt-card-desc', text: s.desc }));
    card.addEventListener('click', () => {
      const inp = $('#msg-input');
      if (inp) { inp.value = s.prompt; autoResize(); inp.focus(); updateSend(); }
    });
    sg.appendChild(card);
  });
  w.appendChild(sg);
  container.appendChild(w);
}

function renderMsg(msg, idx) {
  const isUser = msg.role === 'user';
  const isAsst = msg.role === 'assistant';
  const chat = getChat();
  const isLast = isAsst && idx === chat.messages.length - 1;

  const wrap = el('div', { class: `message role-${isUser ? 'user' : 'assistant'}`, 'data-idx': String(idx) });
  
  const head = el('div', { class: 'message-head' });
  const avatar = el('div', { class: `avatar ${isUser ? 'user' : 'assistant'}` });
  avatar.appendChild(el('span', { text: isUser ? 'U' : 'N' }));
  head.append(avatar, el('span', { class: 'message-role', text: isUser ? 'You' : 'NAXA' }));
  
  if (msg.createdAt) head.appendChild(el('div', { class: 'message-meta-extra' }, [el('span', { text: fmtTime(msg.createdAt) })]));
  wrap.appendChild(head);

  const body = el('div', { class: 'message-body' });

  // Attachments
  if (msg.attachments?.length) {
    const atts = el('div', { class: 'attachments' });
    msg.attachments.forEach(a => {
      const t = el('div', { class: 'attachment-thumb' });
      if (a.type?.startsWith('image/') && a.data) t.appendChild(el('img', { src: a.data, alt: escapeHtml(a.name || '') }));
      else t.appendChild(el('span', { text: (a.name || 'file').slice(0, 6) }));
      atts.appendChild(t);
    });
    body.appendChild(atts);
  }

  const content = el('div', { class: 'message-content' });
  if (isAsst) {
    content.innerHTML = parseMD(msg.content || '');
    if (State.isLoading && isLast) content.appendChild(el('span', { class: 'streaming-caret' }));
  } else {
    content.textContent = msg.content || '';
  }
  body.appendChild(content);

  // Actions
  if (!State.isLoading && msg.content) {
    const acts = el('div', { class: 'message-actions' });
    
    // Copy
    acts.appendChild(el('button', { class: 'action-btn', type: 'button', title: 'Copy', onclick: () => copyMsg(idx) },
      [el('span', { html: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' }), ' Copy']));

    if (isUser) {
      // Edit user message
      acts.appendChild(el('button', { class: 'action-btn', type: 'button', title: 'Edit', onclick: () => editMsg(idx) },
        [el('span', { html: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>' }), ' Edit']));
    }

    if (isAsst) {
      acts.appendChild(el('button', { class: `action-btn${msg.like ? ' active' : ''}`, type: 'button', title: 'Like', onclick: () => toggleLike(idx) },
        [el('span', { html: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>' })]));
      acts.appendChild(el('button', { class: `action-btn${msg.dislike ? ' active dislike' : ''}`, type: 'button', title: 'Dislike', onclick: () => toggleDislike(idx) },
        [el('span', { html: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>' })]));
      
      if (isLast) {
        acts.appendChild(el('button', { class: 'action-btn', type: 'button', title: 'Regenerate', onclick: () => regenerate(idx) },
          [el('span', { html: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>' }), ' Retry']));
        if ('speechSynthesis' in window) {
          acts.appendChild(el('button', { class: 'action-btn', type: 'button', title: 'Read aloud', onclick: () => speakMsg(idx) },
            [el('span', { html: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>' }), ' TTS']));
        }
      }
    }
    wrap.appendChild(acts);
  }

  // Follow-ups
  if (isLast && !State.isLoading && State.settings.followUpEnabled && Array.isArray(msg.followUps) && msg.followUps.length) {
    const fw = el('div', { class: 'follow-ups' });
    msg.followUps.slice(0, State.settings.followUpCount).forEach(q => {
      const chip = el('button', { class: 'follow-up-chip', type: 'button', text: q });
      chip.addEventListener('click', () => { const inp = $('#msg-input'); if (inp) { inp.value = q; autoResize(); send(); } });
      fw.appendChild(chip);
    });
    wrap.appendChild(fw);
  }

  wrap.appendChild(body);
  return wrap;
}

function fmtTime(ts) {
  try { return new Date(ts).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }); } catch { return '--:--'; }
}

function scrollBottom() { const c = $('#chat-container'); if (c) c.scrollTop = c.scrollHeight; }

function updateStreaming(content) {
  const chat = getChat();
  const lastIdx = chat.messages.length - 1;
  const node = $(`.message[data-idx="${lastIdx}"] .message-content`);
  if (!node) return;
  node.innerHTML = parseMD(content || '');
  node.appendChild(el('span', { class: 'streaming-caret' }));
  requestAnimationFrame(scrollBottom);
}

// === MODE ===
function setMode(mode, silent = false) {
  if (!SYSTEM_PROMPTS[mode]) return;
  State.currentMode = mode;
  const chat = getChat();
  chat.mode = mode; chat.updatedAt = Date.now(); save();
  if (!silent) toast(`Mode: ${modeLabel(mode)}`, 'info');
}

function modeLabel(m) { return { erik: 'Erik', assistant: 'Assistant', coder: 'Coder', support: 'Support' }[m] || m; }

// === SYSTEM PROMPT BUILDER ===
function buildSystem() {
  const chat = getChat();
  const parts = [];
  const modePrompt = SYSTEM_PROMPTS[chat.mode || State.currentMode];
  if (modePrompt) parts.push(modePrompt);
  if (State.settings.globalSystemPrompt?.trim()) { parts.push('--- GLOBAL ---'); parts.push(State.settings.globalSystemPrompt.trim()); }
  if (chat.likeFeedback) parts.push(`--- POSITIVE ---\n"${chat.likeFeedback}"`);
  if (chat.dislikeFeedback) parts.push(`--- NEGATIVE ---\n"${chat.dislikeFeedback}"`);
  return parts.join('\n\n');
}

// === PROVIDER ===
function getProvider(name) { return State.providers[name] || State.customProviders.get(name); }

function getCurrentProvider() {
  const name = State.currentProvider;
  const config = getProvider(name);
  if (!config?.apiKey || !config.selectedModel) {
    for (const [n, p] of Object.entries(State.providers)) {
      if (p.apiKey && p.selectedModel) { State.currentProvider = n; return { name: n, config: p, isCustom: false }; }
    }
    for (const [id, p] of State.customProviders) {
      if (p.apiKey && p.selectedModel) { State.currentProvider = id; return { name: id, config: p, isCustom: true }; }
    }
    return null;
  }
  return { name, config, isCustom: !State.providers[name] };
}

function updateModel() {
  const p = getCurrentProvider();
  const el = $('#current-model-name');
  if (!el) return;
  if (p) {
    const m = p.config.selectedModel || 'default';
    el.textContent = `${p.config.name || p.name} ${m.split(/[-:.]/).pop().slice(0, 12)}`;
  } else {
    el.textContent = 'Select Provider';
  }
}

async function loadModels(name) {
  const config = getProvider(name);
  if (!config?.apiKey) { toast('API Key required', 'error'); return; }
  toast('Loading models...', 'info');

  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), C.FETCH_TIMEOUT);

  try {
    let url, headers = {};
    const compat = config.compatible || 'openai';
    if (compat === 'google') {
      url = `${config.baseUrl}/models?key=${encodeURIComponent(config.apiKey)}`;
    } else {
      url = `${config.baseUrl}/models`;
      headers.Authorization = `Bearer ${config.apiKey}`;
    }
    const res = await fetch(url, { headers, signal: ctrl.signal });
    clearTimeout(tid);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    let models = [];
    if (compat === 'google') {
      models = (data.models || []).filter(m => m.supportedGenerationMethods?.includes('generateContent')).map(m => (m.name || '').replace('models/', '')).filter(Boolean);
    } else {
      models = (data.data || []).map(m => m.id).filter(Boolean);
    }
    config.models = models;
    if (!config.selectedModel && models.length) config.selectedModel = models[0];
    if (config.selectedModel && models.includes(config.selectedModel)) State.currentModel = config.selectedModel;
    save(); updateModel(); toast(`${models.length} models loaded`, 'success');
  } catch (err) {
    clearTimeout(tid);
    toast(`Failed: ${err.name === 'AbortError' ? 'Timeout' : err.message}`, 'error');
  }
}

// === API STREAMING ===
async function streamChat(name, config, model, messages, { onChunk, onError, onComplete, signal }) {
  if (!config?.apiKey || !model) { onError(new Error('Not configured')); return; }
  const compat = config.compatible || 'openai';
  let url, headers = { 'Content-Type': 'application/json' }, body;

  if (compat === 'google') {
    url = `${config.baseUrl}/models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(config.apiKey)}`;
    body = {
      contents: messages.filter(m => m.role !== 'system').map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
      systemInstruction: messages.find(m => m.role === 'system') ? { parts: [{ text: messages.find(m => m.role === 'system').content }] } : undefined,
      generationConfig: { temperature: State.settings.temperature, maxOutputTokens: State.settings.maxTokens }
    };
  } else {
    url = `${config.baseUrl}/chat/completions`;
    headers.Authorization = `Bearer ${config.apiKey}`;
    body = { model, messages, stream: State.settings.streamEnabled, temperature: State.settings.temperature, max_tokens: State.settings.maxTokens };
  }

  try {
    const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body), signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    if (!State.settings.streamEnabled || !res.body) {
      const data = await res.json();
      const content = compat === 'google' ? data?.candidates?.[0]?.content?.parts?.[0]?.text || '' : data?.choices?.[0]?.message?.content || '';
      if (content) onChunk(content);
      onComplete(); return;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const payload = t.slice(5).trim();
        if (payload === '[DONE]') { onComplete(); return; }
        try {
          const obj = JSON.parse(payload);
          const delta = compat === 'google' ? obj?.candidates?.[0]?.content?.parts?.[0]?.text || '' : obj?.choices?.[0]?.delta?.content || '';
          if (delta) onChunk(delta);
        } catch {}
      }
    }
    onComplete();
  } catch (err) {
    if (err?.name === 'AbortError') { toast('Stopped', 'info'); return; }
    onError(err);
  }
}

// === SEND MESSAGE ===
async function send() {
  const input = $('#msg-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text || State.isLoading) return;

  const provider = getCurrentProvider();
  if (!provider) { toast('Configure a provider first', 'error'); openProviderSetup(); return; }

  const chat = getChat();
  const userMsg = { role: 'user', content: text, attachments: [...State.attachments], createdAt: Date.now() };
  chat.messages.push(userMsg);
  if (chat.messages.filter(m => m.role === 'user').length === 1) chat.title = text.slice(0, 40) + (text.length > 40 ? '…' : '');
  chat.provider = provider.name; chat.model = provider.config.selectedModel;

  State.attachments = [];
  input.value = ''; autoResize(); renderAttachBar(); updateSend();

  const asstMsg = { role: 'assistant', content: '', like: false, dislike: false, likeFeedback: null, dislikeFeedback: null, followUps: [], createdAt: Date.now() };
  chat.messages.push(asstMsg); chat.updatedAt = Date.now(); save();
  renderMessages(); renderLists();

  State.isLoading = true;
  State.abortController = new AbortController();
  updateSend();

  const apiMsgs = [{ role: 'system', content: buildSystem() }, ...chat.messages.filter(m => (m.role === 'user' || m.role === 'assistant') && m.content).map(m => ({ role: m.role, content: m.content }))];
  let full = '';
  const start = Date.now();

  await streamChat(provider.name, provider.config, provider.config.selectedModel, apiMsgs, {
    signal: State.abortController.signal,
    onChunk: (chunk) => { full += chunk; asstMsg.content = full; updateStreaming(full); },
    onError: (err) => {
      asstMsg.content = `⚠️ **Error:** ${err.message}`;
      State.isLoading = false; State.abortController = null; updateSend(); renderMessages(); toast(`Error: ${err.message}`, 'error');
    },
    onComplete: () => {
      asstMsg.content = full;
      asstMsg.followUps = extractFollowUps(full);
      State.isLoading = false; State.abortController = null; updateSend();
      chat.updatedAt = Date.now(); save(); renderMessages(); renderLists();
      const rt = Date.now() - start;
      State.stats.totalMessages++;
      State.stats.totalTokens += full.split(/\s+/).length;
      State.stats.avgResponseTime = Math.round((State.stats.avgResponseTime * (State.stats.totalMessages - 1) + rt) / State.stats.totalMessages);
      save();
    }
  });
}

function extractFollowUps(text) {
  if (!State.settings.followUpEnabled || typeof text !== 'string') return [];
  const rx = /(?:\?|Vuoi|Posso|Dimmi|Spiegami)[^.?!]*\?/gi;
  const matches = text.match(rx) || [];
  return matches.filter(q => q.trim().length > 10 && q.trim().length < 120).slice(0, State.settings.followUpCount);
}

function stopGen() {
  State.abortController?.abort();
  State.abortController = null;
  State.isLoading = false;
  updateSend();
}

function updateSend() {
  const btn = $('#send-btn');
  const input = $('#msg-input');
  if (!btn) return;
  const has = input?.value.trim().length > 0;
  if (State.isLoading) {
    btn.classList.add('stop'); btn.disabled = false; btn.setAttribute('aria-label', 'Stop');
    btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  } else {
    btn.classList.remove('stop'); btn.disabled = !has; btn.setAttribute('aria-label', 'Send');
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
  }
}

// === MESSAGE ACTIONS ===
function toggleLike(idx) {
  const msg = getChat().messages[idx]; if (!msg) return;
  msg.like = !msg.like; if (msg.like) msg.dislike = false;
  getChat().updatedAt = Date.now(); save(); renderMessages();
}

function toggleDislike(idx) {
  const msg = getChat().messages[idx]; if (!msg) return;
  msg.dislike = !msg.dislike;
  if (msg.dislike) {
    msg.like = false;
    promptModal({
      title: 'What went wrong?', placeholder: 'Optional feedback', value: '', optional: true,
      onSubmit: (val) => { msg.dislikeFeedback = val || null; getChat().dislikeFeedback = val || null; getChat().updatedAt = Date.now(); save(); }
    });
  }
  getChat().updatedAt = Date.now(); save(); renderMessages();
}

function regenerate(idx) {
  if (State.isLoading) return;
  const chat = getChat();
  let userIdx = -1;
  for (let i = idx - 1; i >= 0; i--) { if (chat.messages[i]?.role === 'user') { userIdx = i; break; } }
  if (userIdx < 0) { toast('Cannot regenerate', 'warning'); return; }
  const um = chat.messages[userIdx];
  chat.messages = chat.messages.slice(0, idx); chat.updatedAt = Date.now(); save();
  renderMessages();
  const input = $('#msg-input');
  if (input) { input.value = um.content; autoResize(); updateSend(); }
  send();
}

async function copyMsg(idx) {
  const msg = getChat().messages[idx]; if (!msg?.content) return;
  try { await navigator.clipboard.writeText(msg.content); toast('Copied', 'success'); } catch { toast('Copy failed', 'error'); }
}

function editMsg(idx) {
  const chat = getChat();
  const msg = chat.messages[idx];
  if (!msg || msg.role !== 'user') return;
  promptModal({
    title: 'Edit message', placeholder: 'Message', value: msg.content,
    onSubmit: (val) => {
      if (!val.trim()) return;
      msg.content = val.trim();
      // Remove all messages after this one and regenerate
      chat.messages = chat.messages.slice(0, idx + 1);
      chat.updatedAt = Date.now(); save();
      renderMessages();
      const input = $('#msg-input');
      if (input) { input.value = val; autoResize(); updateSend(); }
      send();
    }
  });
}

function speakMsg(idx) {
  if (!('speechSynthesis' in window)) { toast('TTS not supported', 'error'); return; }
  const msg = getChat().messages[idx]; if (!msg?.content) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(msg.content);
  if (State.settings.ttsVoice) {
    const v = speechSynthesis.getVoices().find(v => v.name === State.settings.ttsVoice);
    if (v) u.voice = v;
  }
  speechSynthesis.speak(u); toast('Speaking...', 'info');
}

// === ATTACHMENTS ===
function handleFiles(files) {
  if (!files?.length) return;
  for (const f of files) {
    if (f.size > 10 * 1024 * 1024) { toast(`${f.name}: too large`, 'warning'); continue; }
    const r = new FileReader();
    r.onload = () => { State.attachments.push({ name: f.name, type: f.type, size: f.size, data: r.result }); renderAttachBar(); };
    r.onerror = () => toast('File read error', 'error');
    r.readAsDataURL(f);
  }
}

function renderAttachBar() {
  const bar = $('#attachment-bar'); if (!bar) return;
  if (!State.attachments.length) { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false; bar.innerHTML = '';
  State.attachments.forEach((a, i) => {
    const item = el('div', { class: 'att-item' });
    if (a.type?.startsWith('image/') && a.data) item.appendChild(el('img', { src: a.data, alt: escapeHtml(a.name) }));
    else item.appendChild(el('span', { html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' }));
    const rm = el('button', { class: 'att-remove', type: 'button', text: '×', onclick: () => { State.attachments.splice(i, 1); renderAttachBar(); } });
    item.appendChild(rm); bar.appendChild(item);
  });
}

// === TEXTAREA ===
let resizeTimer = null;
function autoResize() {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const inp = $('#msg-input'); if (!inp) return;
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 180) + 'px';
    updateSend();
  }, C.DEBOUNCE);
}

// === VOICE ===
function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) { toast('Not supported', 'error'); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.continuous = false; rec.interimResults = false; rec.lang = 'it-IT';
  const btn = $('#btn-voice');
  rec.onstart = () => { btn.classList.add('recording'); toast('Listening...', 'info'); };
  rec.onresult = (e) => {
    const inp = $('#msg-input');
    if (inp) { inp.value += (inp.value ? ' ' : '') + e.results[0][0].transcript; autoResize(); updateSend(); }
  };
  rec.onerror = (e) => { toast('Error: ' + e.error, 'error'); btn.classList.remove('recording'); };
  rec.onend = () => btn.classList.remove('recording');
  rec.start();
}

// === THEME ===
function toggleTheme() {
  if (State.theme === 'auto') State.theme = 'light';
  else if (State.theme === 'light') State.theme = 'dark';
  else State.theme = 'auto';
  applyTheme(); save(); toast(`Theme: ${State.theme}`, 'info');
}

function applyTheme() {
  if (State.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', State.theme);
}

// === SIDEBAR ===
function toggleSidebar() {
  State.sidebarOpen = !State.sidebarOpen;
  const s = $('#sidebar');
  if (s) s.classList.toggle('open', State.sidebarOpen);
  const b = $('#sidebar-backdrop');
  if (b) b.classList.toggle('show', State.sidebarOpen && window.innerWidth <= 900);
  save();
}

function closeSidebar() {
  if (window.innerWidth <= 900) {
    State.sidebarOpen = false;
    $('#sidebar')?.classList.remove('open');
    $('#sidebar-backdrop')?.classList.remove('show');
  }
}

function collapseSidebar() {
  const s = $('#sidebar');
  if (s) { s.classList.toggle('collapsed'); State.sidebarOpen = !s.classList.contains('collapsed'); save(); }
}

// === MODALS ===
function openModal(builder) {
  $('.modal-overlay')?.remove();
  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' });
  builder(modal, overlay);
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  return { overlay, modal };
}

function confirmModal({ title, message, confirm = 'Confirm', danger = false, onConfirm }) {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: title }));
    modal.appendChild(el('p', { text: message }));
    const acts = el('div', { class: 'modal-actions' });
    acts.appendChild(el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Cancel', onclick: () => overlay.remove() }));
    acts.appendChild(el('button', { class: `btn ${danger ? 'btn-danger' : 'btn-primary'}`, type: 'button', text: confirm, onclick: () => { overlay.remove(); onConfirm?.(); } }));
    modal.appendChild(acts);
  });
}

function promptModal({ title, placeholder, value = '', optional = false, onSubmit }) {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: title }));
    const ta = el('textarea', { class: 'textarea-field', rows: '3', placeholder: placeholder || '' });
    ta.value = value;
    modal.appendChild(ta);
    const acts = el('div', { class: 'modal-actions' });
    acts.appendChild(el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Cancel', onclick: () => overlay.remove() }));
    acts.appendChild(el('button', { class: 'btn btn-primary', type: 'button', text: 'Save', onclick: () => {
      const v = ta.value.trim();
      if (!v && !optional) { toast('Required', 'warning'); return; }
      overlay.remove(); onSubmit?.(v);
    }}));
    modal.appendChild(acts);
    setTimeout(() => ta.focus(), 50);
  });
}

// === SETTINGS ===
function openSettings() {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: 'Settings' }));
    
    // Provider
    modal.appendChild(el('h3', { text: 'AI Provider' }));
    const sel = el('select', { class: 'select-field' });
    for (const [k, p] of Object.entries(State.providers)) {
      const o = el('option', { value: k, text: p.name }); if (k === State.currentProvider) o.selected = true; sel.appendChild(o);
    }
    State.customProviders.forEach((p, id) => {
      const o = el('option', { value: id, text: p.name + ' (Custom)' }); if (id === State.currentProvider) o.selected = true; sel.appendChild(o);
    });
    sel.addEventListener('change', () => { State.currentProvider = sel.value; const c = getProvider(sel.value); if (c?.selectedModel) State.currentModel = c.selectedModel; save(); updateModel(); renderModelCfg(modal); });
    modal.appendChild(sel);
    
    const mcDiv = el('div', { id: 'model-cfg' });
    modal.appendChild(mcDiv);
    renderModelCfg(modal);

    // Generation
    modal.appendChild(el('h3', { text: 'Generation' }));
    
    const tempRow = el('div', { class: 'slider-row' });
    const tempH = el('div', { class: 'slider-row-head' });
    tempH.appendChild(el('span', { class: 'toggle-label', text: 'Temperature' }));
    const tempV = el('span', { class: 'slider-val', text: String(State.settings.temperature) });
    tempH.appendChild(tempV); tempRow.appendChild(tempH);
    const tempS = el('input', { type: 'range', class: 'range-slider', min: '0', max: '2', step: '0.1', value: String(State.settings.temperature) });
    tempS.addEventListener('input', () => { tempV.textContent = tempS.value; });
    tempRow.appendChild(tempS); modal.appendChild(tempRow);

    const tokRow = el('div', { class: 'slider-row' });
    const tokH = el('div', { class: 'slider-row-head' });
    tokH.appendChild(el('span', { class: 'toggle-label', text: 'Max Tokens' }));
    const tokV = el('span', { class: 'slider-val', text: String(State.settings.maxTokens) });
    tokH.appendChild(tokV); tokRow.appendChild(tokH);
    const tokS = el('input', { type: 'range', class: 'range-slider', min: '256', max: '8192', step: '256', value: String(State.settings.maxTokens) });
    tokS.addEventListener('input', () => { tokV.textContent = tokS.value; });
    tokRow.appendChild(tokS); modal.appendChild(tokRow);

    // Options
    modal.appendChild(el('h3', { text: 'Options' }));
    
    const mkToggle = (label, desc, on) => {
      const row = el('div', { class: 'toggle-row' });
      const lb = el('div', {});
      lb.appendChild(el('div', { class: 'toggle-label', text: label }));
      lb.appendChild(el('div', { class: 'toggle-desc', text: desc }));
      row.appendChild(lb);
      const t = el('div', { class: 'toggle' + (on ? ' on' : '') });
      t.addEventListener('click', () => t.classList.toggle('on'));
      row.appendChild(t);
      return { row, toggle: t };
    };

    const fu = mkToggle('Follow-up suggestions', 'Auto-generate follow-ups', State.settings.followUpEnabled);
    modal.appendChild(fu.row);
    const st = mkToggle('Stream responses', 'Show as generating', State.settings.streamEnabled);
    modal.appendChild(st.row);
    const en = mkToggle('Send on Enter', 'Enter to send, Shift+Enter newline', State.settings.sendOnEnter);
    modal.appendChild(en.row);

    // System prompt
    modal.appendChild(el('h3', { text: 'System Prompt' }));
    const sp = el('textarea', { class: 'textarea-field', rows: '3', placeholder: 'Global system prompt' });
    sp.value = State.settings.globalSystemPrompt || '';
    modal.appendChild(sp);

    // Mode
    modal.appendChild(el('h3', { text: 'AI Persona' }));
    const ms = el('select', { class: 'select-field' });
    Object.keys(SYSTEM_PROMPTS).forEach(m => { const o = el('option', { value: m, text: modeLabel(m) }); if (m === State.currentMode) o.selected = true; ms.appendChild(o); });
    modal.appendChild(ms);

    const acts = el('div', { class: 'modal-actions' });
    acts.appendChild(el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Cancel', onclick: () => overlay.remove() }));
    acts.appendChild(el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Providers', onclick: () => { overlay.remove(); openProviderSetup(); } }));
    acts.appendChild(el('button', { class: 'btn btn-primary', type: 'button', text: 'Save', onclick: () => {
      State.settings.temperature = parseFloat(tempS.value);
      State.settings.maxTokens = parseInt(tokS.value, 10);
      State.settings.followUpEnabled = fu.toggle.classList.contains('on');
      State.settings.streamEnabled = st.toggle.classList.contains('on');
      State.settings.sendOnEnter = en.toggle.classList.contains('on');
      State.settings.globalSystemPrompt = sp.value;
      setMode(ms.value, true); save(); overlay.remove(); toast('Saved', 'success');
    }}));
    modal.appendChild(acts);
  });
}

function renderModelCfg(modal) {
  const sec = modal.querySelector('#model-cfg'); if (!sec) return; sec.innerHTML = '';
  const config = getProvider(State.currentProvider); if (!config) return;

  sec.appendChild(el('label', { class: 'input-label', text: 'API Key' }));
  const ki = el('input', { type: 'password', class: 'input-field', placeholder: 'Enter API key', value: config.apiKey || '' });
  ki.addEventListener('change', () => { config.apiKey = ki.value.trim(); save(); });
  sec.appendChild(ki);

  const mr = el('div', { style: 'display:flex;gap:8px;margin-top:8px;' });
  const ms = el('select', { class: 'select-field', style: 'flex:1' });
  if (config.models?.length) config.models.forEach(m => { const o = el('option', { value: m, text: m }); if (m === config.selectedModel) o.selected = true; ms.appendChild(o); });
  else ms.appendChild(el('option', { value: '', text: 'No models loaded' }));
  ms.addEventListener('change', () => { config.selectedModel = ms.value; State.currentModel = ms.value; save(); updateModel(); });
  mr.appendChild(ms);
  mr.appendChild(el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Sync', onclick: () => { config.apiKey = ki.value.trim(); save(); loadModels(State.currentProvider); } }));
  sec.appendChild(mr);
}

// === PROVIDER SETUP ===
function openProviderSetup() {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: 'AI Providers' }));
    modal.appendChild(el('p', { text: 'Configure API keys. Stored locally.' }));
    
    const list = el('div', {});
    for (const [k, p] of Object.entries(State.providers)) list.appendChild(providerCard(k, p, false));
    State.customProviders.forEach((p, id) => list.appendChild(providerCard(id, p, true)));
    modal.appendChild(list);

    // Add custom
    modal.appendChild(el('h3', { text: 'Add Custom Provider' }));
    const ni = el('input', { type: 'text', class: 'input-field', placeholder: 'Provider name' });
    modal.appendChild(ni);
    modal.appendChild(el('label', { class: 'input-label', text: 'Base URL' }));
    const ui = el('input', { type: 'url', class: 'input-field', placeholder: 'https://api.example.com/v1' });
    modal.appendChild(ui);
    modal.appendChild(el('label', { class: 'input-label', text: 'Compatibility' }));
    const cs = el('select', { class: 'select-field' });
    cs.appendChild(el('option', { value: 'openai', text: 'OpenAI-compatible' }));
    cs.appendChild(el('option', { value: 'google', text: 'Google Gemini' }));
    modal.appendChild(cs);

    const acts = el('div', { class: 'modal-actions' });
    acts.appendChild(el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Close', onclick: () => overlay.remove() }));
    acts.appendChild(el('button', { class: 'btn btn-primary', type: 'button', text: 'Add', onclick: () => {
      const n = ni.value.trim(), u = ui.value.trim();
      if (!n || !u) { toast('Name & URL required', 'error'); return; }
      if (!u.startsWith('http')) { toast('Invalid URL', 'error'); return; }
      const id = `cp_${Date.now()}`;
      State.customProviders.set(id, { name: n, baseUrl: u, apiKey: '', models: [], selectedModel: '', compatible: cs.value });
      save(); overlay.remove(); openProviderSetup(); toast('Added', 'success');
    }}));
    modal.appendChild(acts);
  });
}

function providerCard(key, config, isCustom) {
  const card = el('div', { style: 'background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-3);' });
  
  const h = el('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:var(--sp-3);' });
  h.appendChild(el('span', { style: 'font-weight:700;font-size:13px;', text: config.name }));
  if (config.apiKey && config.selectedModel) h.appendChild(el('span', { class: 'tag-pill', text: 'Active' }));
  if (isCustom) h.appendChild(el('span', { style: 'font-size:9px;padding:2px 5px;background:var(--warning-light);color:var(--warning);border-radius:var(--r-xs);font-weight:600;', text: 'Custom' }));
  h.appendChild(el('div', { style: 'flex:1' }));
  if (isCustom) {
    const db = el('button', { class: 'btn-icon danger', type: 'button', onclick: () => { State.customProviders.delete(key); save(); card.remove(); toast('Removed', 'success'); } },
      [el('span', { html: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>' })]);
    h.appendChild(db);
  }
  card.appendChild(h);

  card.appendChild(el('label', { class: 'input-label', text: 'API Key', style: 'margin-top:0' }));
  const ki = el('input', { type: 'password', class: 'input-field', placeholder: 'Enter API key', value: config.apiKey || '' });
  ki.addEventListener('change', () => { config.apiKey = ki.value.trim(); save(); });
  card.appendChild(ki);

  const mr = el('div', { style: 'display:flex;gap:8px;margin-top:var(--sp-3);' });
  const ms = el('select', { class: 'select-field', style: 'flex:1' });
  if (config.models?.length) config.models.forEach(m => { const o = el('option', { value: m, text: m }); if (m === config.selectedModel) o.selected = true; ms.appendChild(o); });
  else ms.appendChild(el('option', { value: '', text: 'Click Sync' }));
  ms.addEventListener('change', () => { config.selectedModel = ms.value; if (State.currentProvider === key) { State.currentModel = ms.value; updateModel(); } save(); });
  mr.appendChild(ms);
  mr.appendChild(el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Sync', style: 'white-space:nowrap', onclick: () => {
    config.apiKey = ki.value.trim(); save(); loadModels(key).then(() => {
      ms.innerHTML = ''; config.models.forEach(m => { const o = el('option', { value: m, text: m }); if (m === config.selectedModel) o.selected = true; ms.appendChild(o); });
    });
  }}));
  card.appendChild(mr);
  return card;
}

// === STATISTICS ===
function openStats() {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: 'Statistics' }));
    const grid = el('div', { class: 'stats-grid' });
    [
      { label: 'Messages', value: State.stats.totalMessages },
      { label: 'Tokens', value: State.stats.totalTokens.toLocaleString() },
      { label: 'Chats', value: State.chats.size },
      { label: 'Avg Response', value: `${State.stats.avgResponseTime}ms` },
      { label: 'Saved', value: [...State.chats.values()].filter(c => c.saved).length },
      { label: 'Pinned', value: [...State.chats.values()].filter(c => c.pinned).length },
      { label: 'Providers', value: Object.keys(State.providers).length + State.customProviders.size }
    ].forEach(s => {
      const card = el('div', { class: 'stat-card' });
      card.appendChild(el('div', { class: 'stat-value', text: String(s.value) }));
      card.appendChild(el('div', { class: 'stat-label', text: s.label }));
      grid.appendChild(card);
    });
    modal.appendChild(grid);
    const acts = el('div', { class: 'modal-actions' });
    acts.appendChild(el('button', { class: 'btn btn-primary', type: 'button', text: 'Close', onclick: () => overlay.remove() }));
    modal.appendChild(acts);
  });
}

// === KEYBOARD SHORTCUTS ===
function openShortcuts() {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: 'Keyboard Shortcuts' }));
    const grid = el('div', { class: 'shortcuts-grid' });
    
    const shortcuts = [
      { keys: ['⌘', 'N'], desc: 'New chat' },
      { keys: ['⌘', 'S'], desc: 'Save chat' },
      { keys: ['⌘', 'K'], desc: 'Search chats' },
      { keys: ['⌘', '/'], desc: 'Shortcuts' },
      { keys: ['⌘', 'E'], desc: 'Export chat' },
      { keys: ['⌘', ','], desc: 'Settings' },
      { keys: ['Enter'], desc: 'Send message' },
      { keys: ['Shift', 'Enter'], desc: 'New line' },
      { keys: ['Escape'], desc: 'Close modal' },
      { keys: ['⌘', 'D'], desc: 'Toggle theme' }
    ];

    shortcuts.forEach(s => {
      const item = el('div', { class: 'shortcut-item' });
      item.appendChild(el('span', { text: s.desc }));
      const keys = el('div', { style: 'display:flex;gap:3px;' });

      item.appendChild(keys);
      grid.appendChild(item);
    });
    
    modal.appendChild(grid);
    const acts = el('div', { class: 'modal-actions' });
    acts.appendChild(el('button', { class: 'btn btn-primary', type: 'button', text: 'Close', onclick: () => overlay.remove() }));
    modal.appendChild(acts);
  });
}

// === EXPORT ===
function openExport() {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: 'Export Chat' }));
    const chat = getChat();
    modal.appendChild(el('p', { text: `Exporting: "${chat.title}"` }));
    
    const opts = el('div', { class: 'export-options' });
    
    // JSON
    opts.appendChild(el('button', { class: 'export-option', type: 'button', onclick: () => { exportJSON(chat); overlay.remove(); } }, [
      el('div', { class: 'export-option-icon', text: '📋' }),
      el('div', { class: 'export-option-label', text: 'JSON' })
    ]));
    
    // Markdown
    opts.appendChild(el('button', { class: 'export-option', type: 'button', onclick: () => { exportMD(chat); overlay.remove(); } }, [
      el('div', { class: 'export-option-icon', text: '📝' }),
      el('div', { class: 'export-option-label', text: 'Markdown' })
    ]));
    
    // Text
    opts.appendChild(el('button', { class: 'export-option', type: 'button', onclick: () => { exportTXT(chat); overlay.remove(); } }, [
      el('div', { class: 'export-option-icon', text: '📄' }),
      el('div', { class: 'export-option-label', text: 'Plain Text' })
    ]));
    
    // All data
    opts.appendChild(el('button', { class: 'export-option', type: 'button', onclick: () => { exportAll(); overlay.remove(); } }, [
      el('div', { class: 'export-option-icon', text: '💾' }),
      el('div', { class: 'export-option-label', text: 'All Data' })
    ]));
    
    modal.appendChild(opts);
    const acts = el('div', { class: 'modal-actions' });
    acts.appendChild(el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Cancel', onclick: () => overlay.remove() }));
    modal.appendChild(acts);
  });
}

function downloadFile(name, content, type = 'text/plain') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Exported', 'success');
}

function exportJSON(chat) { downloadFile(`${chat.title || 'chat'}.json`, JSON.stringify(chat, null, 2), 'application/json'); }

function exportMD(chat) {
  let md = `# ${chat.title}\n\n`;
  md += `*Exported: ${new Date().toISOString()}*\n\n---\n\n`;
  chat.messages.forEach(m => {
    md += `## ${m.role === 'user' ? '👤 You' : '🤖 NAXA'}\n\n`;
    md += `${m.content}\n\n---\n\n`;
  });
  downloadFile(`${chat.title || 'chat'}.md`, md, 'text/markdown');
}

function exportTXT(chat) {
  let txt = `${chat.title}\n${'='.repeat(chat.title.length)}\n\n`;
  chat.messages.forEach(m => {
    txt += `[${m.role === 'user' ? 'You' : 'NAXA'}]\n${m.content}\n\n`;
  });
  downloadFile(`${chat.title || 'chat'}.txt`, txt);
}

function exportAll() { downloadFile(`naxa-export-${Date.now()}.json`, JSON.stringify(serialize(), null, 2), 'application/json'); }

// === USER MENU ===
function openUserMenu() {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: 'Menu' }));
    [
      { label: '🌓 Toggle Theme', action: toggleTheme },
      { label: '⚙️ Settings', action: openSettings },
      { label: '🔌 Providers', action: openProviderSetup },
      { label: '📊 Statistics', action: openStats },
      { label: '⌨️ Shortcuts', action: openShortcuts },
      { label: '💾 Save Chat', action: saveCurrent },
      { label: '📤 Export All', action: exportAll },
      { label: '🗑 Clear All', action: clearAll, danger: true }
    ].forEach(item => {
      const btn = el('button', { class: `dropdown-item${item.danger ? ' danger' : ''}`, type: 'button', text: item.label, style: 'width:100%;padding:10px;margin-bottom:4px;' });
      btn.addEventListener('click', () => { overlay.remove(); item.action?.(); });
      modal.appendChild(btn);
    });
    modal.appendChild(el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Close', style: 'width:100%;margin-top:12px;', onclick: () => overlay.remove() }));
  });
}

function clearAll() {
  confirmModal({
    title: 'Clear all chats?', message: 'This will permanently delete all chats.', confirm: 'Clear All', danger: true,
    onConfirm: () => { State.chats.clear(); createNew(); save(); renderLists(); renderMessages(); toast('Cleared', 'success'); }
  });
}

// === EVENT BINDING ===
function bind() {
  const on = (t, e, h, o) => { if (t) t.addEventListener(e, h, o); };

  on($('#btn-new-mission'), 'click', newChat);
  on($('#menu-toggle'), 'click', toggleSidebar);
  on($('#btn-collapse-sidebar'), 'click', collapseSidebar);
  on($('#sidebar-backdrop'), 'click', closeSidebar);
  on($('#btn-settings'), 'click', openSettings);
  on($('#btn-stats'), 'click', openStats);
  on($('#btn-export'), 'click', openExport);
  on($('#btn-shortcuts'), 'click', openShortcuts);
  on($('#user-menu'), 'click', openUserMenu);
  on($('#model-selector'), 'click', openProviderSetup);
  on($('#btn-voice'), 'click', toggleVoice);

  // Search
  let searchTimer = null;
  on($('#search-input'), 'input', (e) => {
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(() => filterChats(e.target.value), C.SEARCH_DEBOUNCE);
  });

  const mi = $('#msg-input');
  on(mi, 'input', autoResize);
  on(mi, 'keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && State.settings.sendOnEnter) { e.preventDefault(); if (!State.isLoading) send(); }
  });

  on($('#send-btn'), 'click', () => { State.isLoading ? stopGen() : send(); });
  on($('#btn-attach'), 'click', () => $('#file-input').click());
  on($('#file-input'), 'change', (e) => { handleFiles(e.target.files); e.target.value = ''; });

  // Delegated copy
  on(document, 'click', async (e) => {
    const btn = e.target.closest('[data-copy-code]');
    if (!btn) return;
    const block = btn.closest('.code-block');
    const code = block?.querySelector('code');
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code.textContent || '');
      const orig = btn.innerHTML; btn.textContent = '✓ Copied';
      setTimeout(() => { btn.innerHTML = orig; }, 1500);
    } catch { toast('Copy failed', 'error'); }
  });

  // Keyboard shortcuts
  on(document, 'keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); newChat(); }
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveCurrent(); }
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#search-input')?.focus(); }
    if (mod && e.key.toLowerCase() === 'e') { e.preventDefault(); openExport(); }
    if (mod && e.key === ',') { e.preventDefault(); openSettings(); }
    if (mod && e.key === '/') { e.preventDefault(); openShortcuts(); }
    if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); toggleTheme(); }
    if (e.key === 'Escape') { $('.modal-overlay')?.remove(); }
  });
}

// === RESTORE ===
function restore() {
  setMode(State.currentMode || 'assistant', true);
  applyTheme(); updateModel();
  if (!State.sidebarOpen) { const s = $('#sidebar'); if (s && window.innerWidth > 900) s.classList.add('collapsed'); }
}

// === BOOTSTRAP ===
function init() {
  load(); restore();
  if (!State.currentChatId || !State.chats.has(State.currentChatId)) {
    if (!State.chats.size) createNew();
    else { const s = [...State.chats.values()].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); State.currentChatId = s[0].id; }
  }
  renderLists(); renderMessages(); renderAttachBar(); bind(); updateSend();

  setInterval(() => {
    if (State.settings.autoSaveDrafts) { const c = getChat(); if (!c.saved && c.messages.length) save(); }
  }, C.AUTO_SAVE);

  setTimeout(() => { const i = $('#msg-input'); if (i && window.innerWidth > 900) i.focus(); }, 300);

  window.addEventListener('beforeunload', (e) => {
    const unsaved = [...State.chats.values()].some(c => !c.saved && c.messages.length);
    if (unsaved) { e.preventDefault(); e.returnValue = 'Unsaved chats.'; }
  });
}

document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', init) : init();
