<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="NAXA Mission Control v5.0 — ChatGPT-style UI with multi-provider AI">
<meta name="theme-color" content="#212121">
<title>NAXA Mission Control v5.0</title>
<style>
/* ==========================================================================
   NAXA v5.0 — ChatGPT-Inspired Design System
   ========================================================================== */

:root {
  /* === CHATGPT PALETTE === */
  --bg-primary: #212121;
  --bg-secondary: #171717;
  --bg-tertiary: #2f2f2f;
  --bg-elevated: #343541;
  --bg-hover: rgba(255, 255, 255, 0.08);
  --bg-active: rgba(255, 255, 255, 0.12);
  
  --surface-user: #2f2f2f;
  --surface-assistant: transparent;
  
  --text-primary: #ececec;
  --text-secondary: #b4b4b4;
  --text-muted: #8e8ea0;
  --text-disabled: #5d5d5d;
  
  --accent: #10a37f;
  --accent-hover: #0d8a6a;
  --accent-light: rgba(16, 163, 127, 0.15);
  
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --border-focus: rgba(16, 163, 127, 0.5);
  
  --error: #ef4444;
  --error-light: rgba(239, 68, 68, 0.15);
  --warning: #f59e0b;
  --warning-light: rgba(245, 158, 11, 0.15);
  --info: #3b82f6;
  --info-light: rgba(59, 130, 246, 0.15);
  
  /* === TYPOGRAPHY === */
  --font-sans: 'Söhne', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Monaco', 'Consolas', monospace;
  --font-serif: 'Georgia', 'Cambria', serif;
  
  /* === SPACING === */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-7: 32px;
  --sp-8: 40px;
  
  /* === RADII === */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-xl: 24px;
  --r-pill: 999px;
  
  /* === SHADOWS === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 8px 28px rgba(0, 0, 0, 0.35);
  --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.45);
  
  /* === TIMING === */
  --t-fast: 120ms;
  --t-normal: 200ms;
  --t-slow: 300ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  
  /* === LAYOUT === */
  --sidebar-w: 260px;
  --sidebar-collapsed: 0px;
  --max-w-message: 768px;
  --header-h: 52px;
}

/* === LIGHT MODE === */
[data-theme="light"] {
  --bg-primary: #ffffff;
  --bg-secondary: #f9f9f9;
  --bg-tertiary: #f4f4f4;
  --bg-elevated: #ffffff;
  --bg-hover: rgba(0, 0, 0, 0.05);
  --bg-active: rgba(0, 0, 0, 0.08);
  
  --surface-user: #f4f4f4;
  --surface-assistant: transparent;
  
  --text-primary: #0d0d0d;
  --text-secondary: #5d5d5d;
  --text-muted: #8e8ea0;
  --text-disabled: #b4b4b4;
  
  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.14);
}

/* === RESET === */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

/* === APP LAYOUT === */
.app {
  display: flex;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  position: relative;
}

/* === SIDEBAR === */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg-secondary);
  display: flex;
  flex-direction: column;
  transition: width var(--t-slow) var(--ease-out), transform var(--t-slow) var(--ease-out);
  z-index: 100;
  overflow: hidden;
  border-right: 1px solid var(--border);
}

.sidebar.collapsed {
  width: var(--sidebar-collapsed);
}

.sidebar-header {
  padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  min-height: 52px;
  border-bottom: 1px solid var(--border);
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  color: var(--text-primary);
}

.sidebar-logo-icon {
  width: 24px;
  height: 24px;
  border-radius: var(--r-sm);
  background: linear-gradient(135deg, var(--accent), #0d8a6a);
  display: grid;
  place-items: center;
  color: white;
  font-size: 11px;
  font-weight: 700;
}

.sidebar-collapse-btn {
  width: 28px;
  height: 28px;
  border-radius: var(--r-sm);
  color: var(--text-secondary);
  display: grid;
  place-items: center;
  transition: all var(--t-fast);
  flex-shrink: 0;
}

.sidebar-collapse-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.btn-new-chat {
  margin: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  transition: all var(--t-fast);
  white-space: nowrap;
  overflow: hidden;
}

.btn-new-chat:hover {
  background: var(--bg-hover);
}

.btn-new-chat-icon {
  flex-shrink: 0;
}

.sidebar-content {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-2);
}

.sidebar-section {
  margin-bottom: var(--sp-5);
}

.sidebar-section-title {
  padding: var(--sp-2) var(--sp-3);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}

.chat-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.chat-item {
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  color: var(--text-secondary);
  transition: all var(--t-fast);
  cursor: pointer;
  position: relative;
  font-size: 14px;
  overflow: hidden;
}

.chat-item:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.chat-item.active {
  background: var(--bg-active);
  color: var(--text-primary);
}

.chat-item-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chat-item-status {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--text-disabled);
}

.chat-item-status.saved {
  background: var(--accent);
}

.chat-item-actions {
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity var(--t-fast);
}

.chat-item:hover .chat-item-actions,
.chat-item.active .chat-item-actions {
  opacity: 1;
}

.btn-icon {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  color: var(--text-muted);
  border-radius: var(--r-sm);
  transition: all var(--t-fast);
  flex-shrink: 0;
}

.btn-icon:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.btn-icon.danger:hover {
  background: var(--error-light);
  color: var(--error);
}

.empty-hint {
  padding: var(--sp-4) var(--sp-3);
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

/* Sidebar footer with settings */
.sidebar-footer {
  padding: var(--sp-2) var(--sp-3);
  border-top: 1px solid var(--border);
}

.user-menu {
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  cursor: pointer;
  transition: background var(--t-fast);
}

.user-menu:hover {
  background: var(--bg-hover);
}

.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #a855f7, #6366f1);
  display: grid;
  place-items: center;
  color: white;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}

.user-name {
  flex: 1;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* === MAIN === */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
  background: var(--bg-primary);
}

.main-header {
  height: var(--header-h);
  padding: 0 var(--sp-4);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

.menu-toggle {
  display: none;
  width: 32px;
  height: 32px;
  color: var(--text-secondary);
  border-radius: var(--r-sm);
  transition: all var(--t-fast);
  place-items: center;
}

.menu-toggle:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.model-selector {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background var(--t-fast);
  font-size: 15px;
  font-weight: 500;
  color: var(--text-primary);
}

.model-selector:hover {
  background: var(--bg-hover);
}

.model-selector-badge {
  font-size: 10px;
  padding: 2px 6px;
  background: var(--accent-light);
  color: var(--accent);
  border-radius: var(--r-sm);
  font-weight: 600;
}

.header-spacer { flex: 1; }

.header-btn {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: var(--text-secondary);
  border-radius: var(--r-sm);
  transition: all var(--t-fast);
  position: relative;
}

.header-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.header-btn .badge {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

/* === CHAT AREA === */
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-6) var(--sp-4) var(--sp-4);
  scroll-behavior: smooth;
}

.chat-messages {
  max-width: var(--max-w-message);
  margin: 0 auto;
  position: relative;
}

/* === MESSAGE === */
.message {
  padding: var(--sp-5) 0;
  animation: messageIn var(--t-slow) var(--ease-out);
  position: relative;
}

@keyframes messageIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-head {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin-bottom: var(--sp-2);
}

.avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-weight: 600;
  font-size: 12px;
  position: relative;
}

.avatar.user {
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  color: white;
}

.avatar.assistant {
  background: var(--accent);
  color: white;
}

.message-role {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.message-meta-extra {
  font-size: 12px;
  color: var(--text-muted);
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.message-body {
  padding-left: 40px;
  position: relative;
}

.message-content {
  color: var(--text-primary);
  line-height: 1.75;
  font-size: 15px;
  word-wrap: break-word;
  overflow-wrap: break-word;
  position: relative;
}

.message.role-user .message-content {
  background: var(--surface-user);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-lg);
}

.message-content p { margin-bottom: var(--sp-3); }
.message-content p:last-child { margin-bottom: 0; }

.message-content h1,
.message-content h2,
.message-content h3 {
  margin: var(--sp-5) 0 var(--sp-3);
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}

.message-content h1 { font-size: 22px; }
.message-content h2 { font-size: 19px; }
.message-content h3 { font-size: 16px; }

.message-content ul,
.message-content ol {
  margin: var(--sp-3) 0 var(--sp-3) var(--sp-6);
}

.message-content li { margin-bottom: var(--sp-2); }

.message-content strong {
  color: var(--text-primary);
  font-weight: 700;
}

.message-content em { color: var(--text-secondary); }

.message-content a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: rgba(16, 163, 127, 0.3);
  text-underline-offset: 2px;
  transition: all var(--t-fast);
}

.message-content a:hover {
  text-decoration-color: var(--accent);
}

.inline-code {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  padding: 2px 6px;
  border-radius: var(--r-sm);
  font-family: var(--font-mono);
  font-size: 13px;
  border: 1px solid var(--border);
}

.code-block {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin: var(--sp-4) 0;
  overflow: hidden;
  position: relative;
}

.code-block-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--sp-2) var(--sp-3);
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-secondary);
}

.copy-code-btn {
  padding: 4px 10px;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-family: var(--font-sans);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all var(--t-fast);
}

.copy-code-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.code-block pre {
  padding: var(--sp-4);
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-primary);
}

.attachments {
  display: flex;
  gap: var(--sp-2);
  flex-wrap: wrap;
  margin: var(--sp-3) 0;
}

.attachment-thumb {
  width: 64px;
  height: 64px;
  border-radius: var(--r-sm);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  display: grid;
  place-items: center;
  color: var(--text-muted);
  font-size: 10px;
  text-align: center;
  padding: var(--sp-1);
  font-family: var(--font-mono);
}

.attachment-thumb img { width: 100%; height: 100%; object-fit: cover; }

.message-actions {
  display: flex;
  gap: var(--sp-1);
  margin-top: var(--sp-2);
  padding-left: 40px;
  opacity: 0;
  transition: opacity var(--t-fast);
}

.message:hover .message-actions {
  opacity: 1;
}

.action-btn {
  padding: 4px 8px;
  border-radius: var(--r-sm);
  color: var(--text-muted);
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all var(--t-fast);
}

.action-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.action-btn.active {
  color: var(--accent);
}

.action-btn.active.dislike {
  color: var(--error);
}

.follow-ups {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  margin-top: var(--sp-4);
  padding-left: 40px;
}

.follow-up-chip {
  padding: var(--sp-3) var(--sp-4);
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text-primary);
  font-size: 14px;
  transition: all var(--t-fast);
  text-align: left;
}

.follow-up-chip:hover {
  background: var(--bg-hover);
  border-color: var(--border-strong);
}

.streaming-caret {
  display: inline-block;
  width: 6px;
  height: 14px;
  background: var(--accent);
  margin-left: 2px;
  vertical-align: middle;
  animation: caretBlink 1s steps(2) infinite;
  border-radius: 1px;
}

@keyframes caretBlink { 50% { opacity: 0; } }

/* === EMPTY STATE (ChatGPT-style welcome) === */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  min-height: 500px;
  text-align: center;
  padding: var(--sp-8) var(--sp-5);
  color: var(--text-primary);
}

.empty-logo {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #0d8a6a);
  display: grid;
  place-items: center;
  color: white;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: var(--sp-5);
  box-shadow: var(--shadow-md);
}

.empty-title {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: var(--sp-2);
  letter-spacing: -0.02em;
}

.empty-subtitle {
  font-size: 15px;
  color: var(--text-secondary);
  margin-bottom: var(--sp-7);
  max-width: 500px;
}

.prompt-suggestions {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--sp-3);
  max-width: 800px;
  width: 100%;
  margin-top: var(--sp-6);
}

.prompt-card {
  padding: var(--sp-4);
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  text-align: left;
  transition: all var(--t-fast);
  cursor: pointer;
}

.prompt-card:hover {
  background: var(--bg-hover);
  border-color: var(--border-strong);
  transform: translateY(-1px);
}

.prompt-card-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: var(--sp-1);
}

.prompt-card-desc {
  font-size: 12px;
  color: var(--text-muted);
}

/* === INPUT AREA === */
.input-area {
  padding: var(--sp-3) var(--sp-4) var(--sp-4);
  flex-shrink: 0;
  background: var(--bg-primary);
  border-top: 1px solid var(--border);
}

.input-wrap {
  max-width: var(--max-w-message);
  margin: 0 auto;
}

.attachment-bar {
  display: flex;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  flex-wrap: wrap;
  animation: messageIn var(--t-normal) var(--ease-out);
}

.att-item {
  position: relative;
  width: 48px;
  height: 48px;
  border-radius: var(--r-sm);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  display: grid;
  place-items: center;
  color: var(--text-muted);
}

.att-item img { width: 100%; height: 100%; object-fit: cover; }

.att-remove {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 16px;
  height: 16px;
  background: rgba(0, 0, 0, 0.8);
  border-radius: 50%;
  color: white;
  display: grid;
  place-items: center;
  font-size: 10px;
  transition: all var(--t-fast);
}

.att-remove:hover { background: var(--error); transform: scale(1.1); }

.input-box {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-xl);
  padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4);
  transition: all var(--t-fast);
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: var(--sp-2);
}

.input-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.msg-input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-size: 15px;
  resize: none;
  min-height: 28px;
  max-height: 200px;
  padding: var(--sp-2) 0;
  line-height: 1.5;
  font-family: var(--font-sans);
}

.msg-input:focus { outline: none; }
.msg-input::placeholder { color: var(--text-muted); }

.input-actions {
  display: flex;
  gap: 2px;
  align-items: center;
  flex-shrink: 0;
}

.circle-btn {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: var(--r-sm);
  color: var(--text-secondary);
  transition: all var(--t-fast);
}

.circle-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.circle-btn.recording {
  color: var(--error);
  animation: recordPulse 1s ease-in-out infinite;
}

@keyframes recordPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.send-btn {
  width: 32px;
  height: 32px;
  background: var(--text-primary);
  color: var(--bg-primary);
  border-radius: var(--r-sm);
  display: grid;
  place-items: center;
  transition: all var(--t-fast);
}

.send-btn:hover:not(:disabled) {
  opacity: 0.85;
  transform: scale(1.02);
}

.send-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.send-btn.stop {
  background: var(--error);
  color: white;
}

.input-footer {
  margin-top: var(--sp-2);
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
}

/* === PROVIDER SELECTOR MODAL === */
.provider-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--sp-3);
}

.provider-option {
  padding: var(--sp-4);
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: all var(--t-fast);
}

.provider-option:hover {
  background: var(--bg-hover);
  border-color: var(--border-strong);
}

.provider-option.active {
  background: var(--accent-light);
  border-color: var(--accent);
}

.provider-option-header {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
}

.provider-option-name {
  font-weight: 600;
  font-size: 14px;
}

.provider-option-status {
  margin-left: auto;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: var(--r-sm);
}

.provider-option-status.online {
  background: var(--accent-light);
  color: var(--accent);
}

.provider-option-status.offline {
  background: var(--bg-hover);
  color: var(--text-muted);
}

.provider-option-model {
  font-size: 12px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
}

/* === MODAL & TOAST === */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  z-index: 1000;
  padding: var(--sp-4);
  animation: modalFade var(--t-normal) var(--ease-out);
}

@keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-lg);
  padding: var(--sp-6);
  max-width: 560px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  animation: modalIn var(--t-normal) var(--ease-spring);
  box-shadow: var(--shadow-xl);
}

@keyframes modalIn {
  from { transform: scale(0.96); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: var(--sp-5);
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.modal h3 {
  font-size: 14px;
  font-weight: 600;
  margin-top: var(--sp-4);
  margin-bottom: var(--sp-2);
  color: var(--text-primary);
}

.modal-actions {
  display: flex;
  gap: var(--sp-2);
  margin-top: var(--sp-5);
  justify-content: flex-end;
}

.btn {
  padding: var(--sp-2) var(--sp-4);
  border-radius: var(--r-sm);
  font-size: 14px;
  font-weight: 500;
  transition: all var(--t-fast);
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  border: 1px solid transparent;
}

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-primary:hover {
  background: var(--accent-hover);
}

.btn-secondary-modal {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border-color: var(--border);
}

.btn-secondary-modal:hover {
  background: var(--bg-hover);
}

.btn-danger {
  background: var(--error);
  color: white;
}

.btn-danger:hover { background: #dc2626; }

/* Toggle */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--border);
}

.toggle-row:last-of-type { border-bottom: none; }
.toggle-label { font-size: 14px; color: var(--text-primary); }
.toggle-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.toggle {
  position: relative;
  width: 40px;
  height: 22px;
  background: var(--bg-tertiary);
  border-radius: 11px;
  transition: background var(--t-fast);
  cursor: pointer;
  flex-shrink: 0;
  border: 1px solid var(--border);
}

.toggle.on {
  background: var(--accent);
  border-color: var(--accent);
}

.toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  background: white;
  border-radius: 50%;
  transition: transform var(--t-normal) var(--ease-spring);
  box-shadow: 0 1px 2px rgba(0,0,0,0.2);
}

.toggle.on::after {
  transform: translateX(18px);
}

/* Slider */
.slider-row { padding: var(--sp-3) 0; border-bottom: 1px solid var(--border); }
.slider-row-head { display: flex; justify-content: space-between; margin-bottom: var(--sp-2); }
.slider-val { color: var(--accent); font-family: var(--font-mono); font-weight: 600; font-size: 13px; }

.range-slider {
  width: 100%;
  height: 4px;
  background: var(--bg-tertiary);
  border-radius: 2px;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
}

.range-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  transition: transform var(--t-fast);
}

.range-slider::-webkit-slider-thumb:hover { transform: scale(1.15); }

.range-slider::-moz-range-thumb {
  width: 16px;
  height: 16px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  border: none;
}

/* === TOAST === */
.toast-stack {
  position: fixed;
  bottom: var(--sp-5);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  z-index: 2000;
  pointer-events: none;
  align-items: center;
}

.toast {
  min-width: 280px;
  max-width: 400px;
  padding: var(--sp-3) var(--sp-4);
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  color: var(--text-primary);
  font-size: 14px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  animation: toastIn var(--t-normal) var(--ease-spring);
  pointer-events: auto;
}

@keyframes toastIn {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.toast.out { animation: toastOut var(--t-normal) var(--ease-out) forwards; }
@keyframes toastOut { to { transform: translateY(20px); opacity: 0; } }

.toast-icon { flex-shrink: 0; }
.toast.success .toast-icon { color: var(--accent); }
.toast.error .toast-icon { color: var(--error); }
.toast.warning .toast-icon { color: var(--warning); }
.toast.info .toast-icon { color: var(--info); }

/* === SCROLLBAR === */
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 4px;
}
*::-webkit-scrollbar-thumb:hover { background: var(--text-disabled); }

/* === SELECTION === */
::selection {
  background: var(--accent);
  color: white;
}

/* === RESPONSIVE === */
@media (max-width: 900px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    height: 100vh;
    transform: translateX(-100%);
    box-shadow: var(--shadow-xl);
  }
  .sidebar.open { transform: translateX(0); }
  .menu-toggle { display: grid; }
  .prompt-suggestions { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
  .message-body { padding-left: 36px; }
  .message-actions { padding-left: 36px; }
  .input-box { border-radius: var(--r-lg); }
}

.sidebar-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-normal);
}

.sidebar-backdrop.show {
  opacity: 1;
  pointer-events: auto;
}

/* === FOCUS VISIBLE === */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

button:focus:not(:focus-visible),
a:focus:not(:focus-visible),
input:focus:not(:focus-visible),
textarea:focus:not(:focus-visible),
select:focus:not(:focus-visible) {
  outline: none;
}

/* === INPUT FIELDS === */
.input-field,
.select-field,
.textarea-field {
  width: 100%;
  padding: var(--sp-2) var(--sp-3);
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--text-primary);
  font-size: 14px;
  transition: all var(--t-fast);
  font-family: var(--font-sans);
}

.input-field:focus,
.select-field:focus,
.textarea-field:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.input-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: var(--sp-1);
  margin-top: var(--sp-3);
}

.input-label:first-child { margin-top: 0; }

.textarea-field { resize: vertical; min-height: 80px; }

/* === STATS DASHBOARD === */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}

.stat-card {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--sp-4);
  text-align: center;
}

.stat-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: var(--sp-1);
  font-family: var(--font-sans);
  letter-spacing: -0.02em;
}

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-weight: 500;
}

/* === CODE EXEC === */
.code-exec-output {
  padding: var(--sp-3);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-primary);
  max-height: 300px;
  overflow-y: auto;
  white-space: pre-wrap;
  margin-top: var(--sp-3);
}

.code-exec-output.error {
  color: var(--error);
  border-color: var(--error);
}

/* === REDUCED MOTION === */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* === TAG === */
.tag-pill {
  font-size: 10px;
  padding: 2px 8px;
  background: var(--accent-light);
  color: var(--accent);
  border-radius: var(--r-pill);
  font-weight: 500;
}

.chat-item-tags {
  display: flex;
  gap: 2px;
  margin-left: auto;
  flex-shrink: 0;
}

/* === LOADING SHIMMER === */
.loading-shimmer {
  display: flex;
  gap: var(--sp-3);
  padding: var(--sp-5) 0;
}

.loading-shimmer-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

.loading-shimmer-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.loading-shimmer-line {
  height: 12px;
  background: linear-gradient(90deg, var(--bg-tertiary) 0%, var(--bg-hover) 50%, var(--bg-tertiary) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--r-sm);
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

/* === DROPDOWN MENU === */
.dropdown-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  padding: var(--sp-2);
  min-width: 200px;
  box-shadow: var(--shadow-lg);
  z-index: 500;
  animation: dropdownIn var(--t-fast) var(--ease-out);
}

@keyframes dropdownIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.dropdown-item {
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  color: var(--text-primary);
  font-size: 14px;
  transition: background var(--t-fast);
  width: 100%;
  text-align: left;
}

.dropdown-item:hover {
  background: var(--bg-hover);
}

.dropdown-item.danger {
  color: var(--error);
}

.dropdown-divider {
  height: 1px;
  background: var(--border);
  margin: var(--sp-2) 0;
}
</style>
</head>

/* ---------------- EVENT BUS ---------------- */

const EventBus = {
  _handlers: new Map(),
  on(event, handler) {
    if (!this._handlers.has(event)) this._handlers.set(event, new Set());
    this._handlers.get(event).add(handler);
    return () => this._handlers.get(event).delete(handler);
  },
  emit(event, payload) {
    const handlers = this._handlers.get(event);
    if (!handlers) return;
    for (const h of handlers) {
      try { h(payload); } catch (err) { console.error(`EventBus [${event}]:`, err); }
    }
  }
};

/* ---------------- DOM HELPERS ---------------- */

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    }
    else node.setAttribute(k, String(v));
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

/* ---------------- MARKDOWN PARSER ---------------- */

function escapeHtml(str) {
  if (typeof str !== 'string') return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function parseMarkdown(text) {
  if (typeof text !== 'string' || !text) return '';
  let s = escapeHtml(text);

  s = s.replace(/```(\w+)?\n([\s\S]*?)```/g, (_m, lang, code) => {
    const language = (lang || 'text').toLowerCase();
    const label = escapeHtml(language);
    const copyBtn = `<button class="copy-code-btn" data-copy-code="1" type="button"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</button>`;
    return `<div class="code-block"><div class="code-block-head"><span>${label}</span>${copyBtn}</div><pre><code>${code.trim()}</code></pre></div>`;
  });

  s = s.replace(/`([^`\n]+)`/g, '<span class="inline-code">$1</span>');
  s = s.replace(/^### (.*$)/gim, '<h3>$1</h3>');
  s = s.replace(/^## (.*$)/gim, '<h2>$1</h2>');
  s = s.replace(/^# (.*$)/gim, '<h1>$1</h1>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');

  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_m, label, url) => {
    const safeUrl = /^(https?|mailto):/i.test(url) ? url : '#';
    return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  });

  s = s.replace(/^(?:[-*+]) (.+)$/gim, '<li>$1</li>');
  s = s.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');

  const blocks = s.split(/\n{2,}/).map(b => {
    const t = b.trim();
    if (!t) return '';
    if (/^<(h[1-3]|ul|ol|div|pre|code)/.test(t)) return t;
    return `<p>${t.replace(/\n/g, '<br>')}</p>`;
  });

  return blocks.filter(Boolean).join('');
}

/* ---------------- TOAST ---------------- */

const TOAST_ICONS = {
  success: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  error: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
  warning: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
};

function toast(message, type = 'info') {
  const stack = $('#toast-stack');
  if (!stack || typeof message !== 'string' || !message) return;

  const icon = TOAST_ICONS[type] || TOAST_ICONS.info;
  const node = el('div', { class: `toast ${type}`, role: 'status' }, [
    el('span', { class: 'toast-icon', html: icon }),
    el('span', { text: message })
  ]);

  stack.appendChild(node);
  setTimeout(() => {
    node.classList.add('out');
    setTimeout(() => node.remove(), 260);
  }, TOAST_DURATION_MS);
}

/* ---------------- PERSISTENCE ---------------- */

function serializeSavedState() {
  const savedChats = Array.from(AppState.chats.values())
    .filter(c => c.saved)
    .map(c => ({
      id: c.id,
      title: c.title,
      messages: c.messages,
      mode: c.mode,
      saved: true,
      createdAt: c.createdAt,
      updatedAt: c.updatedAt,
      likeFeedback: c.likeFeedback,
      dislikeFeedback: c.dislikeFeedback,
      tags: c.tags || [],
      provider: c.provider,
      model: c.model
    }));
  
  const customProviders = Array.from(AppState.customProviders.entries()).map(([id, p]) => ({
    id,
    name: p.name,
    baseUrl: p.baseUrl,
    apiKey: p.apiKey,
    models: p.models,
    selectedModel: p.selectedModel,
    compatible: p.compatible || 'openai'
  }));

  return {
    version: 5,
    providers: AppState.providers,
    customProviders,
    settings: AppState.settings,
    chats: savedChats,
    currentProvider: AppState.currentProvider,
    currentModel: AppState.currentModel,
    currentMode: AppState.currentMode,
    theme: AppState.theme,
    sidebarOpen: AppState.sidebarOpen,
    missionCounter: AppState.missionCounter,
    stats: AppState.stats
  };
}

let saveTimer = null;
function saveState() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      const data = serializeSavedState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (err) {
      if (err && (err.name === 'QuotaExceededError' || /quota/i.test(err.message || ''))) {
        toast('Storage full: pruning old data', 'warning');
        pruneOldSavedMissions();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeSavedState()));
        } catch (e) {
          console.error('doSaveState retry failed:', e);
        }
      } else {
        console.error('doSaveState error:', err);
      }
    }
  }, 300);
}

function pruneOldSavedMissions() {
  const saved = Array.from(AppState.chats.values()).filter(c => c.saved);
  if (saved.length <= MAX_SAVED_MISSIONS) return;
  const sorted = saved.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const toRemove = sorted.slice(MAX_SAVED_MISSIONS);
  toRemove.forEach(c => {
    const chat = AppState.chats.get(c.id);
    if (chat) chat.saved = false;
  });
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return false;

    if (data.providers && typeof data.providers === 'object') {
      for (const key of Object.keys(AppState.providers)) {
        if (data.providers[key]) {
          AppState.providers[key].apiKey = String(data.providers[key].apiKey || '');
          AppState.providers[key].selectedModel = String(data.providers[key].selectedModel || '');
          if (data.providers[key].reasoning) {
            AppState.providers[key].reasoning = String(data.providers[key].reasoning);
          }
        }
      }
    }

    if (Array.isArray(data.customProviders)) {
      AppState.customProviders = new Map();
      for (const p of data.customProviders) {
        if (p && typeof p.id === 'string') {
          AppState.customProviders.set(p.id, {
            name: String(p.name || 'Custom'),
            baseUrl: String(p.baseUrl || ''),
            apiKey: String(p.apiKey || ''),
            models: Array.isArray(p.models) ? p.models : [],
            selectedModel: String(p.selectedModel || ''),
            compatible: String(p.compatible || 'openai')
          });
        }
      }
    }

    if (data.settings && typeof data.settings === 'object') {
      AppState.settings = { ...AppState.settings, ...data.settings };
    }

    if (Array.isArray(data.chats)) {
      AppState.chats = new Map();
      for (const c of data.chats) {
        if (c && typeof c.id === 'string' && c.saved === true) {
          AppState.chats.set(c.id, {
            id: c.id,
            title: String(c.title || 'Untitled'),
            messages: Array.isArray(c.messages) ? c.messages : [],
            mode: SYSTEM_PROMPTS[c.mode] ? c.mode : 'assistant',
            saved: true,
            createdAt: Number(c.createdAt) || Date.now(),
            updatedAt: Number(c.updatedAt) || Date.now(),
            likeFeedback: c.likeFeedback || null,
            dislikeFeedback: c.dislikeFeedback || null,
            tags: Array.isArray(c.tags) ? c.tags : [],
            provider: c.provider || null,
            model: c.model || null
          });
        }
      }
    }

    if (typeof data.currentMode === 'string' && SYSTEM_PROMPTS[data.currentMode]) {
      AppState.currentMode = data.currentMode;
    }
    if (typeof data.currentProvider === 'string') AppState.currentProvider = data.currentProvider;
    if (typeof data.currentModel === 'string') AppState.currentModel = data.currentModel;
    if (typeof data.theme === 'string') AppState.theme = data.theme;
    if (typeof data.sidebarOpen === 'boolean') AppState.sidebarOpen = data.sidebarOpen;
    if (typeof data.missionCounter === 'number') AppState.missionCounter = data.missionCounter;
    if (data.stats && typeof data.stats === 'object') {
      AppState.stats = { ...AppState.stats, ...data.stats };
    }

    return true;
  } catch (err) {
    console.error('loadState error:', err);
    return false;
  }
}

/* ---------------- CHAT MANAGEMENT ---------------- */

function createNewMission() {
  AppState.missionCounter++;
  const id = `chat_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  const chat = {
    id,
    title: 'New chat',
    messages: [],
    mode: AppState.currentMode,
    saved: false,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    likeFeedback: null,
    dislikeFeedback: null,
    tags: [],
    provider: AppState.currentProvider,
    model: AppState.currentModel
  };
  AppState.chats.set(id, chat);
  AppState.currentChatId = id;
  AppState.lastRenderedMessageCount = 0;
  return chat;
}

function getCurrentChat() {
  if (!AppState.currentChatId || !AppState.chats.has(AppState.currentChatId)) {
    return createNewMission();
  }
  return AppState.chats.get(AppState.currentChatId);
}

function saveCurrentMission() {
  const chat = getCurrentChat();
  if (chat.messages.length === 0) {
    toast('Empty chat cannot be saved', 'warning');
    return;
  }
  chat.saved = true;
  chat.updatedAt = Date.now();
  saveState();
  renderChatLists();
  toast('Chat saved', 'success');
}

function newMission() {
  createNewMission();
  renderChatLists();
  renderMessages();
  renderAttachmentBar();
  toast('New chat started', 'info');
}

function selectChat(id) {
  if (typeof id !== 'string' || !AppState.chats.has(id)) return;
  AppState.currentChatId = id;
  AppState.lastRenderedMessageCount = 0;
  const chat = AppState.chats.get(id);
  if (chat) {
    if (chat.mode) setMode(chat.mode, true);
    if (chat.provider) AppState.currentProvider = chat.provider;
    if (chat.model) AppState.currentModel = chat.model;
  }
  renderChatLists();
  renderMessages();
  closeSidebar();
  updateModelSelector();
}

function deleteChat(id, ev) {
  if (ev) ev.stopPropagation();
  if (typeof id !== 'string') return;
  const chat = AppState.chats.get(id);
  const wasSaved = chat && chat.saved;

  openConfirmModal({
    title: wasSaved ? 'Delete saved chat?' : 'Delete chat?',
    message: wasSaved
      ? 'This will permanently delete this chat from your saved items.'
      : 'This chat will be permanently deleted.',
    confirmText: 'Delete',
    danger: true,
    onConfirm: () => {
      AppState.chats.delete(id);
      if (AppState.currentChatId === id) createNewMission();
      saveState();
      renderChatLists();
      renderMessages();
      toast('Chat deleted', 'success');
    }
  });
}

function renameChat(id, ev) {
  if (ev) ev.stopPropagation();
  if (typeof id !== 'string' || !AppState.chats.has(id)) return;
  const chat = AppState.chats.get(id);
  openPromptModal({
    title: 'Rename chat',
    placeholder: 'Chat title',
    defaultValue: chat.title,
    onSubmit: (val) => {
      const trimmed = (val || '').trim();
      if (!trimmed) return;
      chat.title = trimmed.slice(0, 80);
      chat.updatedAt = Date.now();
      saveState();
      renderChatLists();
      toast('Chat renamed', 'success');
    }
  });
}

/* ---------------- RENDERING ---------------- */

function renderChatLists() {
  renderChatList($('#active-chat-list'), false);
  renderChatList($('#saved-chat-list'), true);
}

function renderChatList(container, savedOnly) {
  if (!container) return;
  container.innerHTML = '';

  const chats = Array.from(AppState.chats.values())
    .filter(c => savedOnly ? c.saved : !c.saved)
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
    .slice(0, 50); // Limit to 50 for performance

  if (chats.length === 0) {
    const hint = savedOnly
      ? 'No saved chats'
      : 'No recent chats';
    container.appendChild(el('div', { class: 'empty-hint', text: hint }));
    return;
  }

  for (const chat of chats) {
    const isActive = chat.id === AppState.currentChatId;
    const item = el('div', {
      class: 'chat-item' + (isActive ? ' active' : ''),
      role: 'button',
      tabindex: '0',
      'aria-current': isActive ? 'true' : 'false'
    });

    item.appendChild(el('span', {
      class: 'chat-item-status ' + (chat.saved ? 'saved' : ''),
      title: chat.saved ? 'Saved' : 'Recent'
    }));
    
    item.appendChild(el('span', { class: 'chat-item-title', text: chat.title }));

    const actions = el('div', { class: 'chat-item-actions' });

    const renameBtn = el('button', { class: 'btn-icon', type: 'button', 'aria-label': 'Rename' },
      [el('span', { html: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>' })]);
    const deleteBtn = el('button', { class: 'btn-icon danger', type: 'button', 'aria-label': 'Delete' },
      [el('span', { html: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>' })]);

    renameBtn.addEventListener('click', (e) => renameChat(chat.id, e));
    deleteBtn.addEventListener('click', (e) => deleteChat(chat.id, e));

    actions.appendChild(renameBtn);
    actions.appendChild(deleteBtn);
    item.appendChild(actions);

    item.addEventListener('click', () => selectChat(chat.id));
    item.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectChat(chat.id); }
    });

    container.appendChild(item);
  }
}

function renderMessages() {
  const container = $('#chat-messages');
  if (!container) return;

  const chat = getCurrentChat();
  const msgs = chat.messages || [];

  if (msgs.length === 0) {
    container.innerHTML = '';
    renderEmptyState(container);
    AppState.lastRenderedMessageCount = 0;
    return;
  }

  if (msgs.length !== AppState.lastRenderedMessageCount) {
    container.innerHTML = '';
    msgs.forEach((msg, idx) => container.appendChild(renderMessage(msg, idx)));
    AppState.lastRenderedMessageCount = msgs.length;
  }
  scrollToBottom();
}

function renderEmptyState(container) {
  const wrap = el('div', { class: 'empty-state' });
  
  wrap.appendChild(el('div', { class: 'empty-logo', text: 'N' }));
  wrap.appendChild(el('h1', { class: 'empty-title', text: 'How can I help you today?' }));
  wrap.appendChild(el('p', { class: 'empty-subtitle', text: 'Ask me anything — I\'m powered by multiple AI providers.' }));

  const suggestions = el('div', { class: 'prompt-suggestions' });
  PROMPT_SUGGESTIONS.forEach(s => {
    const card = el('button', { class: 'prompt-card', type: 'button' });
    card.appendChild(el('div', { class: 'prompt-card-title', text: s.title }));
    card.appendChild(el('div', { class: 'prompt-card-desc', text: s.desc }));
    card.addEventListener('click', () => {
      const input = $('#msg-input');
      if (input) {
        input.value = s.prompt;
        autoResizeInput();
        input.focus();
        updateSendButton();
      }
    });
    suggestions.appendChild(card);
  });
  wrap.appendChild(suggestions);
  container.appendChild(wrap);
}

function renderMessage(msg, idx) {
  const isUser = msg.role === 'user';
  const isAssistant = msg.role === 'assistant';
  const chat = getCurrentChat();
  const isLastAssistant = isAssistant && idx === chat.messages.length - 1;

  const wrap = el('div', {
    class: `message role-${isUser ? 'user' : 'assistant'}`,
    'data-idx': String(idx)
  });

  const head = el('div', { class: 'message-head' });
  const avatar = el('div', {
    class: 'avatar ' + (isUser ? 'user' : 'assistant')
  });
  avatar.appendChild(el('span', { text: isUser ? 'U' : 'N' }));
  head.appendChild(avatar);

  head.appendChild(el('span', { class: 'message-role', text: isUser ? 'You' : 'NAXA' }));

  const metaExtra = el('div', { class: 'message-meta-extra' });
  if (msg.createdAt) {
    metaExtra.appendChild(el('span', { text: formatTime(msg.createdAt) }));
  }
  head.appendChild(metaExtra);

  wrap.appendChild(head);

  const body = el('div', { class: 'message-body' });

  if (msg.attachments && msg.attachments.length > 0) {
    const atts = el('div', { class: 'attachments' });
    msg.attachments.forEach(att => {
      const thumb = el('div', { class: 'attachment-thumb' });
      if (att.type && att.type.startsWith('image/') && att.data) {
        thumb.appendChild(el('img', { src: att.data, alt: escapeHtml(att.name || 'image') }));
      } else {
        thumb.appendChild(el('span', { text: att.name ? att.name.slice(0, 8) : 'file' }));
      }
      atts.appendChild(thumb);
    });
    body.appendChild(atts);
  }

  const content = el('div', { class: 'message-content' });
  if (isAssistant) {
    content.innerHTML = parseMarkdown(msg.content || '');
    if (AppState.isLoading && isLastAssistant) {
      content.appendChild(el('span', { class: 'streaming-caret' }));
    }
  } else {
    content.textContent = msg.content || '';
  }
  body.appendChild(content);

  // Message actions (hover)
  if (!AppState.isLoading && msg.content) {
    const actions = el('div', { class: 'message-actions' });

    // Copy
    const copyBtn = el('button', { class: 'action-btn', type: 'button', title: 'Copy' }, [
      el('span', { html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' })
    ]);
    copyBtn.addEventListener('click', () => copyMessage(idx));
    actions.appendChild(copyBtn);

    if (isAssistant) {
      // Like
      const likeBtn = el('button', { class: 'action-btn' + (msg.like ? ' active' : ''), type: 'button', title: 'Like' }, [
        el('span', { html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>' })
      ]);
      likeBtn.addEventListener('click', () => toggleLike(idx));
      actions.appendChild(likeBtn);

      // Dislike
      const disBtn = el('button', { class: 'action-btn' + (msg.dislike ? ' active dislike' : ''), type: 'button', title: 'Dislike' }, [
        el('span', { html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>' })
      ]);
      disBtn.addEventListener('click', () => toggleDislike(idx));
      actions.appendChild(disBtn);

      if (isLastAssistant) {
        // Regenerate
        const regenBtn = el('button', { class: 'action-btn', type: 'button', title: 'Regenerate' }, [
          el('span', { html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>' })
        ]);
        regenBtn.addEventListener('click', () => regenerate(idx));
        actions.appendChild(regenBtn);

        // TTS
        if ('speechSynthesis' in window) {
          const ttsBtn = el('button', { class: 'action-btn', type: 'button', title: 'Read aloud' }, [
            el('span', { html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>' })
          ]);
          ttsBtn.addEventListener('click', () => speakMessage(idx));
          actions.appendChild(ttsBtn);
        }
      }
    }

    wrap.appendChild(actions);
  }

  // Follow-ups
  if (isLastAssistant && !AppState.isLoading && AppState.settings.followUpEnabled && Array.isArray(msg.followUps) && msg.followUps.length > 0) {
    const fwrap = el('div', { class: 'follow-ups' });
    msg.followUps.slice(0, AppState.settings.followUpCount).forEach(q => {
      const chip = el('button', { class: 'follow-up-chip', type: 'button', text: q });
      chip.addEventListener('click', () => {
        const input = $('#msg-input');
        if (input) { input.value = q; autoResizeInput(); sendMessage(); }
      });
      fwrap.appendChild(chip);
    });
    wrap.appendChild(fwrap);
  }

  wrap.appendChild(body);
  return wrap;
}

function formatTime(ts) {
  try {
    const d = new Date(ts);
    return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', hour12: false });
  } catch { return '--:--'; }
}

function scrollToBottom() {
  const c = $('#chat-container');
  if (c) c.scrollTop = c.scrollHeight;
}

function updateStreamingContent(content) {
  const chat = getCurrentChat();
  const lastIdx = chat.messages.length - 1;
  const msgNode = document.querySelector(`.message[data-idx="${lastIdx}"] .message-content`);
  if (!msgNode) return;
  msgNode.innerHTML = parseMarkdown(content || '');
  msgNode.appendChild(el('span', { class: 'streaming-caret' }));
  scrollToBottom();
}

/* ---------------- MODE SWITCHING ---------------- */

function setMode(mode, silent = false) {
  if (!SYSTEM_PROMPTS[mode]) return;
  AppState.currentMode = mode;
  const chat = getCurrentChat();
  chat.mode = mode;
  chat.updatedAt = Date.now();
  saveState();
  if (!silent) toast(`Mode: ${modeLabel(mode)}`, 'info');
}

function modeLabel(m) {
  return { erik: 'Erik', assistant: 'Assistant', coder: 'Coder', support: 'Support' }[m] || m;
}

/* ---------------- SYSTEM PROMPT BUILDER ---------------- */

function buildSystemPrompt() {
  const chat = getCurrentChat();
  const parts = [];

  const modePrompt = SYSTEM_PROMPTS[chat.mode || AppState.currentMode];
  if (modePrompt) parts.push(modePrompt);

  if (AppState.settings.globalSystemPrompt && AppState.settings.globalSystemPrompt.trim()) {
    parts.push('--- GLOBAL INSTRUCTIONS ---');
    parts.push(AppState.settings.globalSystemPrompt.trim());
  }

  if (chat.likeFeedback) {
    parts.push(`--- POSITIVE FEEDBACK ---\n"${chat.likeFeedback}". Maintain this style.`);
  }
  if (chat.dislikeFeedback) {
    parts.push(`--- NEGATIVE FEEDBACK ---\n"${chat.dislikeFeedback}". Avoid this approach.`);
  }

  return parts.join('\n\n');
}

/* ---------------- PROVIDER MANAGEMENT ---------------- */

function getProviderConfig(providerName) {
  if (AppState.providers[providerName]) {
    return AppState.providers[providerName];
  }
  return AppState.customProviders.get(providerName);
}

function getCurrentProvider() {
  // Use active provider
  const providerName = AppState.currentProvider;
  const config = getProviderConfig(providerName);
  
  if (!config || !config.apiKey || !config.selectedModel) {
    // Fallback: find any configured provider
    for (const [name, p] of Object.entries(AppState.providers)) {
      if (p.apiKey && p.selectedModel) {
        AppState.currentProvider = name;
        return { name, config: p, isCustom: false };
      }
    }
    for (const [id, p] of AppState.customProviders) {
      if (p.apiKey && p.selectedModel) {
        AppState.currentProvider = id;
        return { name: id, config: p, isCustom: true };
      }
    }
    return null;
  }
  
  const isCustom = !AppState.providers[providerName];
  return { name: providerName, config, isCustom };
}

function updateModelSelector() {
  const provider = getCurrentProvider();
  const modelName = $('#current-model-name');
  if (!modelName) return;
  
  if (provider) {
    const displayName = provider.config.name || provider.name;
    const model = provider.config.selectedModel || 'default';
    modelName.textContent = `${displayName} ${model.split('-').pop().slice(0, 10)}`;
  } else {
    modelName.textContent = 'Select provider';
  }
}

async function loadModels(providerName) {
  const config = getProviderConfig(providerName);
  if (!config) return;
  
  const apiKey = config.apiKey;
  if (!apiKey) { 
    toast('API Key required', 'error'); 
    return; 
  }

  toast('Loading models...', 'info');

  const timeoutController = new AbortController();
  const timeoutId = setTimeout(() => timeoutController.abort(), FETCH_TIMEOUT_MS);

  try {
    let url, headers = {};
    const compatible = config.compatible || 'openai';
    
    if (compatible === 'google') {
      url = `${config.baseUrl}/models?key=${encodeURIComponent(apiKey)}`;
    } else {
      // OpenAI-compatible (Mistral, Groq, OpenAI, custom)
      url = `${config.baseUrl}/models`;
      headers = { 'Authorization': `Bearer ${apiKey}` };
    }

    const res = await fetch(url, {
      method: 'GET',
      headers,
      signal: timeoutController.signal
    });

    clearTimeout(timeoutId);

    if (!res.ok) {
      let errorMsg = `HTTP ${res.status}`;
      try {
        const errData = await res.json();
        errorMsg = errData?.error?.message || errData?.message || errorMsg;
      } catch { /* ignore */ }
      throw new Error(errorMsg);
    }
    
    const data = await res.json();
    let models = [];
    
    if (compatible === 'google') {
      models = (data.models || [])
        .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent'))
        .map(m => (m.name || '').replace('models/', ''))
        .filter(Boolean);
    } else {
      models = (data.data || []).map(m => m.id).filter(Boolean);
    }

    config.models = models;
    
    if (!config.selectedModel && models.length > 0) {
      config.selectedModel = models[0];
      AppState.currentModel = models[0];
    }
    
    if (config.selectedModel && models.includes(config.selectedModel)) {
      AppState.currentModel = config.selectedModel;
    }

    saveState();
    updateModelSelector();
    toast(`${models.length} models loaded`, 'success');
  } catch (err) {
    clearTimeout(timeoutId);
    console.error('loadModels:', err);
    const msg = err.name === 'AbortError' ? 'Request timeout' : err.message;
    toast(`Failed to load models: ${msg}`, 'error');
  }
}

/* ---------------- API STREAMING (FIXED VERSION) ---------------- */

async function streamChat(providerName, config, model, messages, { onChunk, onError, onComplete, signal }) {
  if (!config || !config.apiKey || !model) {
    onError(new Error('Provider or model not configured'));
    return;
  }

  const compatible = config.compatible || 'openai';
  let url, headers = { 'Content-Type': 'application/json' }, body;

  if (compatible === 'google') {
    url = `${config.baseUrl}/models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(config.apiKey)}`;
    body = {
      contents: messages
        .filter(m => m.role !== 'system')
        .map(m => ({ 
          role: m.role === 'assistant' ? 'model' : 'user', 
          parts: [{ text: m.content }] 
        })),
      systemInstruction: messages.find(m => m.role === 'system')
        ? { parts: [{ text: messages.find(m => m.role === 'system').content }] }
        : undefined,
      generationConfig: {
        temperature: AppState.settings.temperature,
        maxOutputTokens: AppState.settings.maxTokens
      }
    };
  } else {
    // OpenAI-compatible (Mistral, Groq, OpenAI, custom)
    url = `${config.baseUrl}/chat/completions`;
    headers.Authorization = `Bearer ${config.apiKey}`;
    body = {
      model,
      messages,
      stream: AppState.settings.streamEnabled,
      temperature: AppState.settings.temperature,
      max_tokens: AppState.settings.maxTokens
    };
    if (providerName === 'groq' && config.reasoning && config.reasoning !== 'none') {
      body.reasoning_effort = config.reasoning;
    }
  }

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal
    });

    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try {
        const errData = await res.json();
        msg = errData?.error?.message || errData?.message || msg;
      } catch { /* ignore */ }
      throw new Error(msg);
    }

    if (!AppState.settings.streamEnabled || !res.body) {
      // Non-streaming response
      const data = await res.json();
      let content = '';
      if (compatible === 'google') {
        content = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
      } else {
        content = data?.choices?.[0]?.message?.content || '';
      }
      if (content) onChunk(content);
      onComplete();
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === '[DONE]') { 
          onComplete(); 
          return; 
        }
        try {
          const obj = JSON.parse(payload);
          let delta = '';
          if (compatible === 'google') {
            delta = obj?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          } else {
            delta = obj?.choices?.[0]?.delta?.content || '';
          }
          if (delta) onChunk(delta);
        } catch { /* ignore parse errors */ }
      }
    }
    onComplete();
  } catch (err) {
    if (err && err.name === 'AbortError') {
      toast('Generation stopped', 'info');
      return;
    }
    onError(err);
  }
}

/* ---------------- SEND MESSAGE (FIXED) ---------------- */

async function sendMessage() {
  const input = $('#msg-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text || AppState.isLoading) return;

  // 🔧 CRITICAL FIX: Get provider correctly
  const provider = getCurrentProvider();
  if (!provider) {
    toast('Please configure a provider first (click Settings → Providers)', 'error');
    openProviderSetup();
    return;
  }

  const chat = getCurrentChat();
  const userMsg = {
    role: 'user',
    content: text,
    attachments: [...AppState.attachments],
    createdAt: Date.now()
  };
  chat.messages.push(userMsg);
  
  // Auto-title from first message
  if (chat.messages.filter(m => m.role === 'user').length === 1) {
    chat.title = text.slice(0, 40) + (text.length > 40 ? '…' : '');
  }
  
  // Save provider/model info with chat
  chat.provider = provider.name;
  chat.model = provider.config.selectedModel;

  AppState.attachments = [];
  input.value = '';
  autoResizeInput();
  renderAttachmentBar();
  updateSendButton();

  const assistantMsg = {
    role: 'assistant',
    content: '',
    like: false,
    dislike: false,
    likeFeedback: null,
    dislikeFeedback: null,
    followUps: [],
    createdAt: Date.now()
  };
  chat.messages.push(assistantMsg);
  chat.updatedAt = Date.now();
  saveState();

  renderMessages();
  renderChatLists();

  AppState.isLoading = true;
  AppState.abortController = new AbortController();
  updateSendButton();

  const systemPrompt = buildSystemPrompt();
  const apiMessages = [
    { role: 'system', content: systemPrompt },
    ...chat.messages
      .filter(m => (m.role === 'user' || m.role === 'assistant') && m.content)
      .map(m => ({ role: m.role, content: m.content }))
  ];

  const model = provider.config.selectedModel;
  let fullContent = '';
  const startTime = Date.now();

  await streamChat(provider.name, provider.config, model, apiMessages, {
    signal: AppState.abortController.signal,
    onChunk: (chunk) => {
      fullContent += chunk;
      assistantMsg.content = fullContent;
      updateStreamingContent(fullContent);
    },
    onError: (err) => {
      console.error('Stream error:', err);
      assistantMsg.content = `⚠️ **Error:** ${err.message}\n\nPlease check your API key and model selection in Settings.`;
      AppState.isLoading = false;
      AppState.abortController = null;
      updateSendButton();
      renderMessages();
      toast(`Error: ${err.message}`, 'error');
    },
    onComplete: () => {
      assistantMsg.content = fullContent;
      assistantMsg.followUps = extractFollowUps(fullContent);
      AppState.isLoading = false;
      AppState.abortController = null;
      updateSendButton();
      chat.updatedAt = Date.now();
      saveState();
      renderMessages();
      renderChatLists();
      
      // Update stats
      const responseTime = Date.now() - startTime;
      AppState.stats.totalMessages++;
      AppState.stats.totalTokens += fullContent.split(/\s+/).length;
      AppState.stats.avgResponseTime = Math.round(
        (AppState.stats.avgResponseTime * (AppState.stats.totalMessages - 1) + responseTime) / AppState.stats.totalMessages
      );
      saveState();
    }
  });
}

function extractFollowUps(text) {
  if (!AppState.settings.followUpEnabled) return [];
  if (typeof text !== 'string') return [];
  const out = [];
  const rx = /(?:\?|Vuoi|Posso|Dimmi|Spiegami)[^.?!]*\?/gi;
  const matches = text.match(rx) || [];
  for (const m of matches) {
    const q = m.trim();
    if (q.length > 10 && q.length < 120 && out.length < AppState.settings.followUpCount) {
      out.push(q);
    }
  }
  return out;
}

function stopGeneration() {
  if (AppState.abortController) {
    AppState.abortController.abort();
    AppState.abortController = null;
  }
  AppState.isLoading = false;
  updateSendButton();
}

function updateSendButton() {
  const btn = $('#send-btn');
  const input = $('#msg-input');
  if (!btn) return;
  
  const hasText = input && input.value.trim().length > 0;
  
  if (AppState.isLoading) {
    btn.classList.add('stop');
    btn.disabled = false;
    btn.setAttribute('aria-label', 'Stop');
    btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  } else {
    btn.classList.remove('stop');
    btn.disabled = !hasText;
    btn.setAttribute('aria-label', 'Send');
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
  }
}

/* ---------------- MESSAGE ACTIONS ---------------- */

function toggleLike(idx) {
  const chat = getCurrentChat();
  const msg = chat.messages[idx];
  if (!msg) return;
  
  msg.like = !msg.like;
  if (msg.like) {
    msg.dislike = false;
  }
  
  chat.updatedAt = Date.now();
  saveState();
  renderMessages();
}

function toggleDislike(idx) {
  const chat = getCurrentChat();
  const msg = chat.messages[idx];
  if (!msg) return;
  
  msg.dislike = !msg.dislike;
  if (msg.dislike) {
    msg.like = false;
    openPromptModal({
      title: 'What went wrong?',
      placeholder: 'Optional feedback to improve responses',
      defaultValue: '',
      optional: true,
      onSubmit: (val) => {
        msg.dislikeFeedback = val || null;
        chat.dislikeFeedback = val || null;
        chat.updatedAt = Date.now();
        saveState();
        if (val) toast('Feedback saved', 'success');
      }
    });
  }
  
  chat.updatedAt = Date.now();
  saveState();
  renderMessages();
}

function regenerate(idx) {
  if (AppState.isLoading) return;
  const chat = getCurrentChat();
  let userIdx = -1;
  for (let i = idx - 1; i >= 0; i--) {
    if (chat.messages[i] && chat.messages[i].role === 'user') { 
      userIdx = i; 
      break; 
    }
  }
  if (userIdx < 0) { 
    toast('Cannot regenerate', 'warning'); 
    return; 
  }
  const userMsg = chat.messages[userIdx];
  chat.messages = chat.messages.slice(0, idx);
  chat.updatedAt = Date.now();
  saveState();
  renderMessages();
  const input = $('#msg-input');
  if (input) { 
    input.value = userMsg.content; 
    autoResizeInput(); 
    updateSendButton();
  }
  sendMessage();
}

async function copyMessage(idx) {
  const chat = getCurrentChat();
  const msg = chat.messages[idx];
  if (!msg || !msg.content) return;
  try {
    await navigator.clipboard.writeText(msg.content);
    toast('Copied to clipboard', 'success');
  } catch {
    toast('Copy failed', 'error');
  }
}

function speakMessage(idx) {
  if (!('speechSynthesis' in window)) {
    toast('Text-to-speech not supported', 'error');
    return;
  }

  const chat = getCurrentChat();
  const msg = chat.messages[idx];
  if (!msg || !msg.content) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(msg.content);
  
  if (AppState.settings.ttsVoice) {
    const voices = speechSynthesis.getVoices();
    const voice = voices.find(v => v.name === AppState.settings.ttsVoice);
    if (voice) utterance.voice = voice;
  }

  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;

  speechSynthesis.speak(utterance);
  toast('Speaking...', 'info');
}

/* ---------------- FILE ATTACHMENTS ---------------- */

function handleFiles(files) {
  if (!files || files.length === 0) return;
  for (const file of files) {
    if (file.size > 10 * 1024 * 1024) {
      toast(`${file.name}: too large (max 10MB)`, 'warning');
      continue;
    }
    const reader = new FileReader();
    reader.onload = () => {
      AppState.attachments.push({
        name: file.name,
        type: file.type,
        size: file.size,
        data: reader.result
      });
      renderAttachmentBar();
    };
    reader.onerror = () => toast('File read error', 'error');
    reader.readAsDataURL(file);
  }
}

function renderAttachmentBar() {
  const bar = $('#attachment-bar');
  if (!bar) return;
  if (AppState.attachments.length === 0) {
    bar.hidden = true;
    bar.innerHTML = '';
    return;
  }
  bar.hidden = false;
  bar.innerHTML = '';
  AppState.attachments.forEach((att, i) => {
    const item = el('div', { class: 'att-item' });
    if (att.type && att.type.startsWith('image/') && att.data) {
      item.appendChild(el('img', { src: att.data, alt: escapeHtml(att.name) }));
    } else {
      item.appendChild(el('span', {
        html: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
      }));
    }
    const remove = el('button', { class: 'att-remove', type: 'button', 'aria-label': 'Remove', text: '×' });
    remove.addEventListener('click', () => {
      AppState.attachments.splice(i, 1);
      renderAttachmentBar();
    });
    item.appendChild(remove);
    bar.appendChild(item);
  });
}

/* ---------------- TEXTAREA AUTO-RESIZE ---------------- */

let resizeTimer = null;
function autoResizeInput() {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const input = $('#msg-input');
    if (!input) return;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    updateSendButton();
  }, DEBOUNCE_MS);
}

/* ---------------- VOICE INPUT ---------------- */

function toggleVoiceInput() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    toast('Speech recognition not supported', 'error');
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'it-IT';

  const btn = $('#btn-voice');

  recognition.onstart = () => {
    btn.classList.add('recording');
    toast('Listening...', 'info');
  };

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    const input = $('#msg-input');
    if (input) {
      input.value += (input.value ? ' ' : '') + transcript;
      autoResizeInput();
      updateSendButton();
    }
  };

  recognition.onerror = (event) => {
    toast('Speech error: ' + event.error, 'error');
    btn.classList.remove('recording');
  };

  recognition.onend = () => {
    btn.classList.remove('recording');
  };

  recognition.start();
}

/* ---------------- THEME ---------------- */

function toggleTheme() {
  const current = AppState.theme;
  if (current === 'auto') AppState.theme = 'light';
  else if (current === 'light') AppState.theme = 'dark';
  else AppState.theme = 'auto';
  applyTheme();
  saveState();
  toast(`Theme: ${AppState.theme}`, 'info');
}

function applyTheme() {
  const theme = AppState.theme;
  if (theme === 'auto') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
}

/* ---------------- SIDEBAR ---------------- */

function toggleSidebar() {
  AppState.sidebarOpen = !AppState.sidebarOpen;
  const sidebar = $('#sidebar');
  if (sidebar) {
    sidebar.classList.toggle('open', AppState.sidebarOpen);
  }
  const backdrop = $('#sidebar-backdrop');
  if (backdrop) {
    backdrop.classList.toggle('show', AppState.sidebarOpen && window.innerWidth <= 900);
  }
  saveState();
}

function closeSidebar() {
  if (window.innerWidth <= 900) {
    AppState.sidebarOpen = false;
    const sidebar = $('#sidebar');
    if (sidebar) sidebar.classList.remove('open');
    const backdrop = $('#sidebar-backdrop');
    if (backdrop) backdrop.classList.remove('show');
  }
}

function collapseSidebar() {
  const sidebar = $('#sidebar');
  if (sidebar) {
    sidebar.classList.toggle('collapsed');
    AppState.sidebarOpen = !sidebar.classList.contains('collapsed');
    saveState();
  }
}

/* ---------------- MODALS ---------------- */

function openModal(contentBuilder) {
  // Close any existing modal
  const existing = document.querySelector('.modal-overlay');
  if (existing) existing.remove();
  
  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' });
  contentBuilder(modal, overlay);
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  return { overlay, modal };
}

function openConfirmModal({ title, message, confirmText = 'Confirm', danger = false, onConfirm }) {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: title }));
    modal.appendChild(el('p', { text: message, style: 'color:var(--text-secondary);line-height:1.6;font-size:14px;' }));
    const actions = el('div', { class: 'modal-actions' });
    const cancel = el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Cancel' });
    cancel.addEventListener('click', () => overlay.remove());
    const confirm = el('button', { class: 'btn ' + (danger ? 'btn-danger' : 'btn-primary'), type: 'button', text: confirmText });
    confirm.addEventListener('click', () => { overlay.remove(); if (typeof onConfirm === 'function') onConfirm(); });
    actions.appendChild(cancel);
    actions.appendChild(confirm);
    modal.appendChild(actions);
  });
}

function openPromptModal({ title, placeholder, defaultValue = '', optional = false, onSubmit }) {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: title }));
    const textarea = el('textarea', {
      class: 'textarea-field',
      rows: '3',
      placeholder: placeholder || ''
    });
    textarea.value = defaultValue || '';
    modal.appendChild(textarea);
    const actions = el('div', { class: 'modal-actions' });
    const cancel = el('button', { class: 'btn btn-secondary-modal', type: 'button', text: 'Cancel' });
    cancel.addEventListener('click', () => overlay.remove());
    const submit = el('button', { class: 'btn btn-primary', type: 'button', text: 'Save' });
    submit.addEventListener('click', () => {
      const val = textarea.value.trim();
      if (!val && !optional) { toast('Field cannot be empty', 'warning'); return; }
      overlay.remove();
      if (typeof onSubmit === 'function') onSubmit(val);
    });
    actions.appendChild(cancel);
    actions.appendChild(submit);
    modal.appendChild(actions);
    setTimeout(() => textarea.focus(), 50);
  });
}

function openInfoModal({ title, body }) {
  openModal((modal, overlay) => {
    modal.appendChild(el('h2', { text: title }));
    modal.appendChild(el('pre', { text: body, class: 'code-exec-output' }));

}

function renderModelConfig(modal) {
  const section = modal.querySelector('#model-config-section');
  if (!section) return;
  section.innerHTML = '';
  
  const providerName = AppState.currentProvider;
  const config = getProviderConfig(providerName);
  
  if (!config) return;

  // API Key
  section.appendChild(el('label', { class: 'input-label', text: 'API Key' }));
  const apiKeyInput = el('input', { 
    type: 'password', 
    class: 'input-field', 
    placeholder: 'Enter API key',
    value: config.apiKey || ''
  });
  apiKeyInput.addEventListener('change', () => {
    config.apiKey = apiKeyInput.value.trim();
    saveState();
  });
  section.appendChild(apiKeyInput);

  // Model select with sync button
  const modelRow = el('div', { style: 'display:flex;gap:8px;margin-top:8px;' });
  const modelSelect = el('select', { class: 'select-field', style: 'flex:1' });
  
  if (config.models && config.models.length > 0) {
    config.models.forEach(m => {
      const opt = el('option', { value: m, text: m });
      if (m === config.selectedModel) opt.selected = true;
      modelSelect.appendChild(opt);
    });
  } else {
    modelSelect.appendChild(el('option', { value: '', text: 'No models loaded' }));
  }
  
  modelSelect.addEventListener('change', () => {
    config.selectedModel = modelSelect.value;

    saveState();

  });
